 [1, 1, 1, 1], "k": ["Map critical services", "Assess suppliers", "Test impact tolerances", "Monitor incidents", "Report"], "l": 2, "u": "Maps services and monitors suppliers", "s": []}, {"n": "Accountability Mapping (SM&CR)", "t": "n", "m": [1, 1, 1, 1], "k": ["Map responsibilities to senior managers", "Record statements", "Review on change", "Evidence"], "l": 1, "u": "Drafts responsibility maps and tracks changes", "s": []}, {"n": "Customer-Facing Explainability & Fairness", "t": "n", "m": [1, 1, 1, 1], "k": ["Generate plain-language reasons", "Test bias", "Review outcomes", "Provide appeal path"], "l": 2, "u": "Generates plain-language reasons and tests for bias", "s": []}], "v": [[], [], [], []], "lev": {"l": "K,R", "e": ["E1"], "n": "Regulator data on oversight and understanding, not ROI."}, "reg": ["R1", "R2", "R3", "R4", "R13"]}], "seg": ["Secured", "Unsecured", "Commercial", "ABL"], "ntask": 165, "src": [["Genpact: UK bank, four coordinated mortgage agents incl. document standardisation", "https://www.genpact.com/case-studies/how-a-major-uk-bank-cut-mortgage-offer-times-with-agentic-ai"], ["Finova: UK broker mortgage application agent", "https://ibsintelligence.com/?p=575198"], ["Multimodal: draw management, low-risk automated, high-risk to humans", "https://www.multimodal.dev/agentic-workflows/agentic-lending"], ["UK Finance: agentic underwriting, document chasing, memo for human validation", "https://www.ukfinance.org.uk/news-and-insight/blog/data-decision-how-agentic-ai-revolutionising-lending-workflows"], ["Abrigo: agentic LOS, document checks, exception validation, covenant setup", "https://www.abrigo.com/blog/what-does-agentic-los-mean-what-is-it/"], ["StackAI: commercial lending, spreading, covenant testing, evidence assembly", "https://www.stackai.com/insights/how-commercial-lenders-use-ai-agents-to-process-loan-applications-and-financial-statements"], ["Nelito: agentic collections prioritisation (India context)", "https://www.nelito.com/blog/agentic-ai-enabled-loan-management-system.html"], ["Let's Data Science: nCino/IDC and Tavant touchless servicing agent", "https://letsdatascience.com/news/mortgage-lenders-deploy-ai-agents-across-workflows-0c3ea665"], ["Pennant: straight-through personal loans, asset validation, underwriter assistant", "https://www.pennanttech.com/blog/agentic-ai-adoption-in-lending-a-financial-institutions-playbook/"]], "ev": [["E1", "75% of UK financial firms use AI and a further 10% plan to within 3 years; 55% of AI use cases have some automated decision-making, 2% are fully autonomous; 84% of firms have a person accountable for AI; 34% report complete understanding of the AI they use", "FCA / Bank of England AI survey (2024). All UK financial services, not lending-specific. 118 respondent firms, Nov 2024 per the Bank of England report (taken from the Opus review, not re-checked by me)", "https://www.fca.org.uk/publications/research-notes/ai-uk-financial-services", "Regulator", "Medium"], ["E2", "Average cost to originate a US mortgage about $11,600 (Q3 2023, retail lenders); top quartile about $6,900, bottom quartile about $16,500; personnel is 67% of production cost", "Freddie Mac cost-to-originate study 2024. US retail mortgages", "https://sf.freddiemac.com/docs/pdf/cost-to-originate-full-study-2024.pdf", "Independent study (GSE)", "High"], ["E3", "Automation saves 2.2 to 12.36 hours per loan (about $165 to $388 personnel cost); digital tools cut closing cycle by up to 8 days (about $190 cost of funds); heavy users of digital tools average about $1,500 (about 14%) lower cost per loan and about 5 days shorter cycle (34 vs 39 days)", "Freddie Mac 2024. US mortgages. Digital tools, not agentic AI. A GSE assessing the tools in its own sector, so Medium not High", "https://sf.freddiemac.com/docs/pdf/cost-to-originate-full-study-2024.pdf", "Independent study (GSE)", "Medium"], ["E4", "Survey respondents estimate a fully digital origination process could cut cost per loan by up to 40%", "Freddie Mac 2024. Respondent opinion, not measured result", "https://sf.freddiemac.com/docs/pdf/cost-to-originate-full-study-2024.pdf", "Independent study (GSE)", "Low"], ["E5", "30% faster lead time to mortgage offer and 10% NPS improvement; baseline case-packaging rework up to 60% and underwriters spending about half their time on admin; four agents, outputs returned for underwriter review", "Genpact case study, unnamed UK retail bank (about 70,000 mortgages a year). No cost, FTE or accuracy figures given", "https://www.genpact.com/case-studies/how-a-major-uk-bank-cut-mortgage-offer-times-with-agentic-ai", "Vendor case study", "Medium"], ["E6", "About 90% less time answering climate-risk questionnaires (over 2 hours to under 15 minutes); gen AI deployments 30 to 50% faster with modular architecture", "McKinsey, gen AI in credit risk. Based on a 24-institution executive survey, self-reported. Covers climate questionnaires and deployment speed, not underwriting or collections productivity", "https://www.mckinsey.com/capabilities/risk-and-resilience/our-insights/embracing-generative-ai-in-credit-risk", "Consultancy", "Medium"], ["E7", "60 to 70% less time on commercial relationship reviews (two days to a week down to hours)", "nCino, unnamed US institution, no sample size or method", "https://thefintechtimes.com/ncino-ai-agent-slashes-bank-credit-review-times-by-70/", "Vendor claim", "Low"], ["E8", "25 to 40% lower per-loan processing cost across origination, underwriting and servicing", "Azilen blog, no named customer or method", "https://www.azilen.com/?p=33157", "Vendor claim", "Low"], ["E9", "One national private lender cut deal preparation time by 70%", "StackAI, single unnamed customer", "https://www.stackai.com/solutions/commercial-lending", "Vendor claim", "Low"], ["E10", "About 40% manual intervention and multiple weeks to offer in a typical UK mortgage process", "Celent profile of Digilytics, vendor description of the problem", "https://www.celent.com/en/directory/companies/digilytics-ai", "Vendor claim", "Low"], ["E11", "44% of UK mortgage decision-makers rank AI agents as top transformation priority (35% globally); 68% process automation targeted within five years", "IDC study as reported by nCino and a secondary article. Adoption intent, not ROI", "https://letsdatascience.com/news/mortgage-lenders-deploy-ai-agents-across-workflows-0c3ea665", "Vendor-reported survey", "Low"]], "rg": [["R1", "UK GDPR Arts 22A to 22D, as replaced by the Data (Use and Access) Act 2025 (s80, in force 5 Feb 2026)", ["D", "D", "I", "I"], "Solely automated decisions with legal or similarly significant effect are now allowed on any lawful basis except recognised legitimate interests (Art 6(1)(ea)) if safeguards exist: information about the decision, a chance to make representations, meaningful human involvement or intervention by a reviewer who can change the outcome, and a way to contest. Special category data stays restricted to specified conditions. ICO guidance is still draft as at 22 Oct 2026 and no final date has been announced.", "Automated approve or decline decisions can run at L4 only with those safeguards. Human involvement before a decision can take it outside \"solely automated\". Features derived from spend data must not infer special category data such as health.", "https://www.legislation.gov.uk/ukpga/2025/18/section/80", "Legislation.gov.uk s80 (Arts 22A to 22D checked) plus ICO page; law-firm summary no longer relied on", "Primary for the Articles; ICO guidance still draft"], ["R2", "FCA approach to AI: Consumer Duty and SM&CR", ["D", "D", "I", "I"], "The FCA says it does not plan extra AI-specific rules and relies on existing frameworks. Consumer Duty applies to AI use (products that meet needs, fair value, understandable communications, support). SM&CR senior manager accountability is relevant. The page does not mention agentic AI.", "Each agent use case needs a named accountable senior manager and outcome monitoring for retail customers. Commercial and ABL feel this mainly through SM&CR and any retail-like customers.", "https://www.fca.org.uk/firms/ai-approach", "Regulator page", "Primary"], ["R3", "FCA Mills Review on AI in retail financial services (July 2026)", ["I", "I", "I", "I"], "Per a law firm summary (Review itself not read): no standalone AI regime, reliance on Consumer Duty, SM&CR, operational resilience and the critical third parties regime. It flags difficulty tracing decisions and showing reasonable steps with autonomous systems, and possible perimeter changes. FCA intends to publish AI good and poor practice guidance later in 2026.", "Direction of travel is traceability and accountability for agents. Check for the new guidance before any client delivery.", "https://www.freeths.co.uk/insights-events/legal-articles/2026/fca-s-mills-review-agentic-ai-consumer-duty-and-the-future-of-financial-services/", "Law firm summary", "Secondary: read the Review itself"], ["R4", "PRA SS1/23 model risk management principles", ["F", "F", "F", "F"], "Applies directly to firms with internal model approval (IRB, IMA, IMM). Other PRA-regulated firms are expected to treat it as a benchmark (this wider expectation is per the Opus review and not re-verified). Current version dated 23 Apr 2026, previous version effective 17 May 2024. Five principles: model identification and risk classification, governance, development and use, independent validation, risk mitigants. AI and ML models are in scope, with explainability, drift monitoring and bias assessment. Firms stay accountable for third-party models.", "Every agent that influences a decision needs an inventory entry, risk tier, independent validation and a fallback. Buying a vendor agent does not transfer accountability. Direct for internal-model firms, benchmark or expectation for other banks and building societies. Not applicable to non-bank lenders outside PRA scope.", "https://www.bankofengland.co.uk/prudential-regulation/publication/2023/may/model-risk-management-principles-for-banks-ss", "Bank of England SS1/23 page (scope checked)", "Primary for scope; principles list per vendor summary"], ["R5", "FCA CONC 5.2A creditworthiness assessment (regulated consumer credit)", ["-", "D", "I", "-"], "A reasonable creditworthiness assessment is required before lending or a significant increase, covering credit risk and affordability risk. Firms must take reasonable steps to determine income and non-discretionary spending, and stated income alone is generally not enough. Vulnerability indicators must be considered. Records must show the assessment was reasonable, and policies need governing body approval. Guarantors of regulated agreements need a separate assessment. The extract does not address automated processes.", "Agentic affordability needs evidence of verification and an auditable record. Guarantor assessment applies only to guarantors of regulated agreements. Applies to commercial only for sole traders and small partnerships up to 25,000 pounds and guarantors.", "https://www.handbook.fca.org.uk/handbook/CONC/5/2A.html", "FCA Handbook", "Primary"], ["R6", "FCA FG21/1 fair treatment of vulnerable customers", ["D", "D", "I", "-"], "Vulnerability is a spectrum. Firms should understand customer needs, equip staff, design products to avoid harm, communicate understandably, record customer needs and review outcome MI. The page does not cover collections or technology in detail, and a July 2026 update points to Consumer Duty pages for MI expectations.", "Agents in servicing, monitoring and collections need vulnerability detection, a human handoff path and outcome reporting.", "https://fca.org.uk/publications/finalised-guidance/guidance-firms-fair-treatment-vulnerable-customers", "FCA page summary", "Primary summary: read FG21/1 PDF for collections"], ["R7", "FCA perimeter for business lending (context)", ["-", "-", "I", "I"], "Lending to limited companies and business loans over 25,000 pounds to sole traders and partnerships are unregulated. Consumer credit rules apply to sole traders and small partnerships up to 25,000 pounds. Regulated mortgages apply to individuals where at least 40% of the property is used as a dwelling.", "Commercial and ABL carry few conduct rules, so the binding constraints are PRA model risk, SM&CR, data protection for individuals (directors, guarantors) and contract. Caveat: this is an FCA submission to Parliament of unverified date. Buy-to-let is largely unregulated, so check the RAO and current law before relying on this.", "https://committees.parliament.uk/writtenevidence/51703/html/", "FCA written evidence", "Primary but date unverified"], ["R8", "FCA MCOB 11.6 mortgage affordability", ["D", "-", "-", "-"], "Checked on the FCA Handbook: MCOB 11.6.2R (responsible lending assessment), 11.6.8R (income evidence, including automated sources), 11.6.18R (interest-rate stress of at least +1% over at least 5 years). Further rules cited by the Opus review but not checked by me: 11.6.3R, 11.6.5R, 11.6.41R, 11.6.49R, 11.6.60R.", "Agentic affordability for regulated mortgages must evidence verified income and a stress test. Automated income evidence is permitted if it meets the rule. Read the unchecked rules before client use.", "https://handbook.fca.org.uk/handbook/mcob11/mcob11s7", "FCA Handbook MCOB 11.6", "Primary for 3 rules; the rest unchecked"], ["R9", "FCA CONC 7 and MCOB 13: arrears, default and repossession", ["D", "D", "-", "-"], "Summary only, not fetched. Lenders must treat customers in arrears or default fairly, give them time and information, consider forbearance, and follow pre-action requirements before possession. Unsecured default needs a default notice and, under the Consumer Credit Act, a notice of sums in arrears.", "Collection agents must hand off to a person when vulnerability or hardship signals appear. Enforcement steps are not for autonomous action.", "https://www.handbook.fca.org.uk/handbook/CONC/7.html", "FCA Handbook, general knowledge, not fetched", "Not verified: check before client use"], ["R10", "Money Laundering Regulations 2017 and OFSI sanctions", ["D", "D", "D", "D"], "Summary only, not fetched. Customer due diligence, ongoing monitoring and suspicious activity reporting duties apply to all lenders. Sanctions screening is strict liability in effect, with OFSI enforcement.", "Screening agents can triage and clear obvious false positives, but SAR filing and sanctions decisions stay with a person (MLRO).", "https://www.legislation.gov.uk/uksi/2017/692/contents", "Legislation, general knowledge, not fetched", "Not verified: check before client use"], ["R11", "FCA Consumer Duty (PS22/9, PRIN 2A)", ["D", "D", "I", "-"], "Summary only, not fetched. Four outcomes: products and services, price and value, consumer understanding, consumer support. Firms must monitor outcomes and show good outcomes for retail customers.", "Every retail-facing agent needs outcome monitoring, test-and-learn evidence and explanations a customer can understand.", "https://www.handbook.fca.org.uk/handbook/PRIN/2A/", "FCA Handbook, general knowledge, not fetched", "Not verified: check before client use"], ["R12", "FCA DISP, Financial Ombudsman Service and Lending Standards Board", ["D", "D", "I", "I"], "Summary only, not fetched. Complaints must be handled under DISP with FOS referral rights for eligible customers. The Lending Standards Board codes may apply to some commercial and SME lending and some retail products depending on firm signatory status.", "Complaint classification and drafting agents need a person to sign off responses. Check whether the client is an LSB code signatory.", "https://www.handbook.fca.org.uk/handbook/DISP/", "FCA Handbook, general knowledge, not fetched", "Not verified: check before client use"], ["R13", "PRA SS2/21 outsourcing and third-party risk, and operational resilience", ["D", "D", "D", "D"], "Summary only, not fetched. Outsourcing and material third-party arrangements need due diligence, exit plans and resilience for important business services. Critical third parties regime is new.", "A vendor agent in an important business service needs an exit plan, concentration-risk view and tested fallback.", "https://www.bankofengland.co.uk/prudential-regulation/publication/2021/march/outsourcing-and-third-party-risk-management-ss", "Bank of England, general knowledge, not fetched", "Not verified: check before client use"]]};const S=D.seg;let cur=-1;const LN=['','Assist','Human-in-loop','Supervised','Autonomous'];
