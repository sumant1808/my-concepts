<style>
html,body{margin:0;height:100%;background:#050B14;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#0B1626;color:#EAF0F7;font-family:'DM Sans',system-ui,sans-serif;display:flex;flex-direction:column}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
@keyframes slide{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes drift{0%{transform:translate(0,0)}50%{transform:translate(24px,-18px)}100%{transform:translate(0,0)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(94,224,207,.55)}70%{box-shadow:0 0 0 12px rgba(94,224,207,0)}100%{box-shadow:0 0 0 0 rgba(94,224,207,0)}}
.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
.pop{opacity:0;animation:pop .5s cubic-bezier(.2,.8,.2,1) forwards}
.slide{opacity:0;animation:slide .6s cubic-bezier(.2,.7,.2,1) forwards}
.grow{transform-origin:left center;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards}
.orb{position:absolute;border-radius:50%;animation:drift 9s ease-in-out infinite;pointer-events:none}
.pulse{animation:pulse 1.6s ease-out infinite}
button{font-family:'DM Sans',system-ui,sans-serif;cursor:pointer}
button:focus-visible{outline:2px solid #5EE0CF;outline-offset:3px}
h1,h2{margin:0}
.eb{font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:#5EE0CF;font-weight:700}
.h2{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:48px;line-height:1.08;max-width:1000px}
.card{background:#12253B;border:1px solid #223B57;border-radius:16px;box-sizing:border-box}
.big{font-family:'Fraunces',Georgia,serif;font-weight:700;line-height:1}
.btn{min-height:44px;padding:0 22px;border-radius:999px;border:1px solid #3A5675;background:transparent;color:#EAF0F7;font-size:16px;font-weight:500}
.btn.p{border:0;background:#5EE0CF;color:#0B1626;font-weight:700}
.btn.a{border:0;background:#F4B942;color:#0B1626;font-weight:700}
@media (prefers-reduced-motion:reduce){.rise,.pop,.slide{animation:none;opacity:1}.grow{animation:none;transform:none}.orb,.pulse{animation:none}}
</style>

    dir: ['R10', 'R13'], ind: ['R1', 'R2', 'R3', 'R7', 'R12'] }
];
function drill(idx) {
  const g = DR[idx];
  const lv = g.L.map((v, k) => '<div class="grow" style="animation-delay:.7s;flex:' + v + ' 1 0;min-width:0;border-radius:6px;background:' + LC[k] + ';color:#0B1626;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center">L' + (k + 1) + ' ' + v + '</div>').join('');
  const steps = g.steps.map((s, k) => '<div class="slide" style="animation-delay:' + (0.5 + k * 0.12) + 's;padding:12px 14px;border-radius:12px;background:#12253B;border:1px solid #223B57;box-sizing:border-box;min-height:66px"><div style="font-size:12px;color:#F4B942;font-weight:700">' + String(k + 1).padStart(2, '0') + ' · ' + s[1] + ' sub-tasks</div><div style="margin-top:4px;font-size:16px;line-height:1.25;font-weight:500">' + s[0] + '</div></div>').join('');
  const chip = (r, k, d, bg, fg, bd) => '<div class="pop" style="animation-delay:' + (1.9 + k * 0.08) + 's;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:500;background:' + bg + ';color:' + fg + ';border:1px solid ' + bd + '">' + RN[r] + '</div>';
  const rules = g.dir.map((r, k) => chip(r, k, 0, '#1D4E5A', '#EAF0F7', '#5EE0CF')).join('') + g.ind.map((r, k) => chip(r, k + g.dir.length, 0, 'transparent', '#B4C2D6', '#3A5675')).join('');
  return wrap(eyebrow('07 · Segment drill-down · ' + g.n) + '<h2 class="rise" style="animation-delay:.1s;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:36px;line-height:1.12;max-width:1060px">' + g.note + '</h2>' +
    '<div style="display:flex;gap:28px;align-items:stretch"><div class="pop card" style="animation-delay:.3s;width:350px;flex:none;padding:22px;display:flex;flex-direction:column;gap:14px">' +
    '<div style="display:flex;gap:24px"><div><div class="big" style="font-size:52px;color:#5EE0CF">' + g.caps + '</div><div style="font-size:14px;color:#B4C2D6;margin-top:4px">of 124 capabilities apply</div></div><div><div class="big" style="font-size:52px;color:#F4B942">' + g.tasks + '</div><div style="font-size:14px;color:#B4C2D6;margin-top:4px">segment-specific sub-tasks</div></div></div>' +
    '<div style="font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#A9B8CC;font-weight:700">Autonomy mix</div><div style="display:flex;gap:3px;height:34px">' + lv + '</div>' +
    '<div style="font-size:13px;color:#A9B8CC;line-height:1.4">L1 assist · L2 human-in-loop · L3 supervised · L4 autonomous</div>' +
    '<button class="btn a" data-act="openDet" data-v="' + idx + '" style="margin-top:4px;padding:0 18px">Drill into capabilities</button></div>' +
    '<div style="flex:1;min-width:0"><div class="rise" style="animation-delay:.35s;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#F4B942;font-weight:700;margin-bottom:10px">Segment journey, in order</div><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">' + steps + '</div></div></div>' +
    '<div><div class="rise" style="animation-delay:1.7s;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#5EE0CF;font-weight:700;margin-bottom:8px">Rules that bind this segment directly (outlined = reaches it indirectly)</div><div style="display:flex;flex-wrap:wrap;gap:8px">' + rules + '</div><div class="rise" style="animation-delay:2.6s;margin-top:8px;font-size:12px;color:#A9B8CC">* Summary level, from general knowledge, not fetched. Verify before client use.</div></div>', 'gap:16px;padding-top:44px');
}
function slide12() {
  const cols = [['Checked against source', '#5EE0CF', 'SS1/23 scope. Articles 22A to 22D. Three mortgage affordability rules (MCOB 11.6).'], ['Verify before client use', '#F4B942', 'Orange and dark capability tags. Five further MCOB rules. Regulation rows R9 to R13, written from general knowledge.'], ['Still open', '#B4C2D6', 'Named vendors per segment. Three or more FDE prototype candidates per segment. Merging segment tasks into the capability lists.']]
    .map((c, k) => '<div class="rise card" style="animation-delay:' + (0.4 + k * 0.3) + 's;padding:22px"><div style="font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:' + c[1] + ';font-weight:700">' + c[0] + '</div><div style="margin-top:10px;font-size:17px;line-height:1.5">' + c[2] + '</div></div>').join('');
  return wrap(eyebrow('08 · What to trust, what is next') + h2('An independent review corrected the draft. Here is how far to trust it.') +
    '<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px">' + cols + '</div>' +
    '<div class="rise" style="animation-delay:1.4s;font-size:20px;line-height:1.45;max-width:960px">Next step: pick the vendors and prototype loop, or take this story to a client as it stands.</div>', 'gap:24px');
}
function slideHtml(i) {
  if (i === 0) return slide1();
  if (i <= 6) return [null, slide2, slide3, slide4, slide5, slide6, slide7][i]();
  if (i <= 10) return drill(i - 7);
  return slide12();
}

/* ---------- nav ---------- */
function renderSlide() { $('slide').innerHTML = slideHtml(S.i); }

  const dots = Array.from({ length: N }, (_, k) => '<button aria-label="Go to step ' + (k + 1) + '" data-act="go" data-v="' + k + '" style="width:' + (k === S.i ? 34 : 10) + 'px;height:10px;padding:0;border:0;border-radius:999px;background:' + (k === S.i ? '#5EE0CF' : '#3A5675') + '"></button>').join('');
  $('nav').innerHTML = '<div style="display:flex;align-items:center;gap:8px">' + dots + '<div style="margin-left:12px;font-size:14px;color:#A9B8CC">' + (S.i + 1) + ' of ' + N + '</div></div><div style="display:flex;gap:12px"><button class="btn" data-act="prev">Back</button><button class="btn p" data-act="next" style="padding:0 26px;font-weight:700">' + (S.i === 0 ? 'Start the tour' : (S.i === N - 1 ? 'Replay' : 'Next')) + '</button></div>';
}
function goto(n) { S.i = Math.max(0, Math.min(N - 1, n)); renderSlide(); renderNav(); }

/* ---------- detail ---------- */

  const old = el.querySelector('#pane');

  }
  if (sel) {
    sel.c.filter((c) => c[2][det] === '1').forEach((c, k) => {
      const open = S.open === k;
      const tag = c[1] === 'a' ? 'Build opportunity' : (c[1] === 'o' ? 'Partner capability' : '');
      pane += '<div style="flex:none;border-radius:12px;background:#12253B;border:1px solid #223B57"><button data-act="cap" data-v="' + k + '" style="width:100%;text-align:left;padding:14px 16px;border:0;background:transparent;color:#EAF0F7;display:flex;gap:14px;align-items:flex-start"><span style="flex:none;padding:3px 10px;border-radius:8px;background:' + LC[c[3] - 1] + ';color:#0B1626;font-size:14px;font-weight:700">L' + c[3] + '</span><span style="flex:1;min-width:0"><span style="display:block;font-size:17px;font-weight:700">' + esc(c[0]) + ' <span style="font-size:12px;font-weight:500;color:#F4B942">' + tag + '</span></span><span style="display:block;margin-top:3px;font-size:14px;line-height:1.4;color:#B4C2D6">' + esc(c[4]) + '</span></span><span style="flex:none;font-size:13px;color:#5EE0CF;font-weight:700">' + (open ? 'Hide ' : 'Show ') + c[6].length + ' sub-tasks</span></button>' +
        (open ? '<div style="padding:0 16px 14px;display:flex;flex-direction:column;gap:6px">' + c[6].map((t, j) => '<div style="display:flex;gap:10px;font-size:14px;line-height:1.4"><span style="flex:none;width:22px;color:#5EE0CF;font-weight:700">' + (j + 1) + '</span><span>' + esc(t) + '</span></div>').join('') + '</div>' : '') + '</div>';
    });
  }
  el.style.display = 'flex';
  el.style.flexDirection = 'column';
  el.style.padding = '26px 40px 22px';
  el.style.boxSizing = 'border-box';
  el.style.gap = '16px';
  el.innerHTML = '<div style="display:flex;align-items:center;justify-content:space-between;gap:16px"><div style="display:flex;align-items:center;gap:16px"><button class="btn" data-act="closeDet">Back to story</button><div style="font-family:Fraunces,Georgia,serif;font-size:30px;font-weight:700">' + SEGN[det] + ' <span style="font-family:DM Sans,system-ui,sans-serif;font-size:16px;font-weight:400;color:#A9B8CC">capability detail</span></div></div><div style="display:flex;gap:8px">' + tabs + '</div></div>' +

}

/* ---------- demo ---------- */
const STEPS = [
  { agent: 'Application Capture agent', lv: 3, title: 'Broker application received', did: 'Validates 14 fields in real time and normalises the address. Nothing missing.', log: 'Validated 14 of 14 fields, address normalised' },
  { agent: 'Pre-Qualification agent', lv: 3, title: 'Soft search and AIP', did: 'Runs a soft search and affordability estimate within policy, then drafts an Agreement in Principle marked indicative.', log: 'Soft search passed, indicative AIP drafted within policy' },
  { agent: 'Document Collection agent', lv: 4, title: 'Checklist and requests', did: 'Builds the document checklist for an employed purchase and sends the request to the broker.', log: 'Checklist of 5 document types built, request sent to broker' },
  { agent: 'Document Collection agent', lv: 4, title: 'Documents classified', did: 'Classifies the documents as they arrive. Four of five types are in. The P60 is missing.', log: '4 of 5 document types classified, P60 missing' },
  { agent: 'Data Enrichment agent', lv: 4, title: 'Extract and standardise', did: 'Reads income, employer and balances from the documents into one standard case record.', log: 'Income, employer and balances written to the case record' },
  { agent: 'Data Enrichment agent', lv: 4, title: 'Cross-check against declared data', did: 'Declared income £62,000 against payslips annualised at £58,400, a gap of 5.8%.', log: 'Payslip income 5.8% below declared income, flagged' },
  { agent: 'Document Collection agent + referral rule', lv: 4, title: 'Chase and refer', did: 'Drafts a P60 chaser to the broker. Refers the income mismatch to a person, because a mismatch can be a fraud signal.', log: 'P60 chaser sent, income mismatch referred to a person' },
  { agent: 'Pipeline and SLA agent', lv: 3, title: 'Hand off to underwriter', did: 'Queues the case for the underwriter with the full audit trail. The agent does not approve or decline.', log: 'Case queued for underwriter with full audit trail' }
];
const OK = '#5EE0CF', MISS = '#F4B942', FLAG = '#FF8A7A';
const ROWS = [
  [1, 'Applicant', 'A. Example (fictional)', 'OK', OK], [1, 'Purchase price', '£285,000', 'OK', OK], [1, 'Deposit', '£42,750 (15%)', 'OK', OK], [1, 'Loan and LTV', '£242,250 at 85% LTV', 'OK', OK], [1, 'Declared income', '£62,000', 'OK', OK],
  [2, 'Agreement in Principle', 'Draft, indicative only', 'DRAFT', OK], [3, 'Documents requested', '5 document types', 'SENT', OK],
  [4, 'ID', 'Received', 'OK', OK], [4, 'Payslips', 'Received', 'OK', OK], [4, 'Bank statements', 'Received', 'OK', OK], [4, 'Deposit proof', 'Received', 'OK', OK], [4, 'P60', 'Not received', 'MISSING', MISS],
  [5, 'Payslip income, annualised', '£58,400', 'OK', OK], [6, 'Income check', '5.8% below declared', 'FLAG', FLAG],
  [7, 'P60 chaser', 'Drafted and sent to broker', 'SENT', OK], [7, 'Income mismatch', 'Referred to a person', 'REFERRED', FLAG], [8, 'Case status', 'In the underwriter queue', 'READY', OK]
];
function demoBegin() {
  if (timer) clearInterval(timer);
  S.demo = 1; S.play = true; renderDem();
  timer = setInterval(() => {
    if (!S.play) return;
    if (S.demo >= 8) { S.play = false; renderDem(); return; }
    S.demo++; renderDem();
  }, 2600);
}
function demoClose() { if (timer) { clearInterval(timer); timer = null; } S.demo = 0; S.play = false; renderDem(); }
function renderDem() {
  const el = $('dem');
  const d = S.demo;
  if (d < 1) { el.style.display = 'none'; el.innerHTML = ''; return; }
  const logOld = el.querySelector('#dlog');
  const steps = STEPS.map((s, k) => {
    const n = k + 1, a = n === d;
    return '<div class="' + (a ? 'pulse' : '') + '" style="flex:none;padding:10px 14px;border-radius:12px;background:' + (a ? '#1D4E5A' : '#12253B') + ';border:1px solid ' + (a ? '#5EE0CF' : '#223B57') + ';opacity:' + (n > d ? 0.55 : 1) + '"><div style="display:flex;align-items:center;gap:10px"><span style="flex:none;width:26px;height:26px;border-radius:50%;background:' + (a ? '#5EE0CF' : (n < d ? '#9FB3CC' : '#52627A')) + ';color:#0B1626;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center">' + n + '</span><span style="flex:1;min-width:0;font-size:15px;font-weight:700">' + s.title + '</span><span style="flex:none;padding:2px 8px;border-radius:6px;background:' + LC[s.lv - 1] + ';color:#0B1626;font-size:12px;font-weight:700">L' + s.lv + '</span></div>' +
      (a ? '<div style="margin-top:8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#5EE0CF;font-weight:700">' + s.agent + '</div><div style="margin-top:4px;font-size:14px;line-height:1.45">' + s.did + '</div>' : '') + '</div>';
  }).join('');
  const rows = ROWS.filter((r) => r[0] <= d).map((r) => '<div class="' + (r[0] === d ? 'pop' : '') + '" style="display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid #1E3550"><span style="flex:none;width:170px;font-size:14px;color:#B4C2D6">' + r[1] + '</span><span style="flex:1;min-width:0;font-size:15px;font-weight:500">' + r[2] + '</span><span style="flex:none;padding:2px 9px;border-radius:6px;background:' + r[4] + ';color:#0B1626;font-size:12px;font-weight:700">' + r[3] + '</span></div>').join('');
  const log = STEPS.slice(0, d).map((s, k) => '<div class="' + (k === d - 1 ? 'slide' : '') + '" style="font-size:13px;line-height:1.5;color:#B4C2D6"><b style="color:#EAF0F7">Step ' + (k + 1) + ' · L' + s.lv + ' ·</b> ' + s.log + '</div>').join('');
  const label = d >= 8 && !S.play ? 'Replay' : (S.play ? 'Pause' : 'Play');
  el.style.display = 'flex'; el.style.flexDirection = 'column'; el.style.padding = '26px 40px 22px'; el.style.boxSizing = 'border-box'; el.style.gap = '14px';
  el.innerHTML = '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:20px"><div><div style="font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#5EE0CF;font-weight:700">Agent demo · Secured · Origination · simulated, fictional data</div><h2 style="margin:6px 0 0;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:32px;line-height:1.1">' + (d >= 8 ? 'The case reaches the underwriter with the gaps already flagged' : STEPS[d - 1].title) + '</h2></div>' +
    '<div style="display:flex;gap:10px;flex:none"><button class="btn" data-act="demoClose">Back to capabilities</button><button class="btn p" data-act="demoToggle">' + label + '</button><button class="btn" data-act="demoNext">Next step</button><button class="btn" data-act="demoRestart">Restart</button></div></div>' +
    '<div style="flex:none;height:6px;border-radius:3px;background:#12253B"><div style="height:6px;border-radius:3px;background:#5EE0CF;width:' + Math.round(d / 8 * 100) + '%;transition:width .8s ease"></div></div>' +
    '<div style="flex:1;min-height:0;display:flex;gap:18px"><div style="width:390px;flex:none;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px">' + steps + '</div>' +
    '<div style="flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px"><div style="flex:1;min-height:0;overflow-y:auto;border-radius:14px;background:#12253B;border:1px solid #223B57;padding:14px 18px"><div style="font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#F4B942;font-weight:700;margin-bottom:8px">Case file DEMO-0001 builds as the agents work</div>' + rows + '</div>' +
    '<div id="dlog" style="height:130px;flex:none;overflow-y:auto;border-radius:14px;background:#0F1F33;border:1px solid #223B57;padding:10px 16px"><div style="font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#5EE0CF;font-weight:700;margin-bottom:6px">Audit trail</div>' + log + '</div></div></div>' +
    (d >= 8 ? '<div class="rise" style="flex:none;padding:12px 20px;border-radius:12px;border:1px solid #F4B942;background:#241E12;color:#F8D88B;font-size:16px;line-height:1.4"><b>A person decides.</b> The agents prepared the case, chased the gap and flagged the income mismatch. None of them approved or declined it.</div>' : '');
  const nl = el.querySelector('#dlog');
  if (nl) nl.scrollTop = nl.scrollHeight;
}

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === 'go') goto(+v);
  else if (a === 'prev') goto(S.i - 1);
  else if (a === 'next') goto(S.i === N - 1 ? 0 : S.i + 1);
  else if (a === 'openDet') { S.det = +v; S.tab = 'F'; S.stg = 0; S.open = -1; renderDet(); }
  else if (a === 'closeDet') { S.det = -1; renderDet(); }
  else if (a === 'tab') { S.tab = v; S.stg = 0; S.open = -1; renderDet(); }
  else if (a === 'stg') { S.stg = +v; S.open = -1; renderDet(); }
  else if (a === 'cap') { S.open = S.open === +v ? -1 : +v; renderDet(); }
  else if (a === 'demoOpen') demoBegin();
  else if (a === 'demoClose') demoClose();
  else if (a === 'demoToggle') { if (S.demo >= 8 && !S.play) demoBegin(); else if (!timer) demoBegin(); else { S.play = !S.play; renderDem(); } }
  else if (a === 'demoNext') { S.demo = Math.min(8, S.demo + 1); S.play = false; renderDem(); }
  else if (a === 'demoRestart') demoBegin();
});
document.addEventListener('keydown', (e) => {
  if (S.det >= 0 || S.demo > 0) return;
  if (e.key === 'ArrowRight') goto(S.i + 1);
  if (e.key === 'ArrowLeft') goto(S.i - 1);
});
function fit() {
  const s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  const st = $('stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.left = Math.max(0, (window.innerWidth - 1280 * s) / 2) + 'px';
  st.style.top = Math.max(0, (window.innerHeight - 720 * s) / 2) + 'px';
}
window.addEventListener('resize', fit);
fit(); renderSlide(); renderNav();
</script>
