<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agentic UK Asset Management: Guided Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#050B14;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#0B1626;color:#EAF0F7;font-family:'DM Sans',system-ui,sans-serif;display:flex;flex-direction:column}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
@keyframes slide{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes drift{0%{transform:translate(0,0)}50%{transform:translate(24px,-18px)}100%{transform:translate(0,0)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(94,224,207,.55)}70%{box-shadow:0 0 0 12px rgba(94,224,207,0)}100%{box-shadow:0 0 0 0 rgba(94,224,207,0)}}
.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
.pop{opacity:0;animation:pop .5s cubic-bezier(.2,.8,.2,1) forwards}
.slide{opacity:0;animation:slide .6s cubic-bezier(.2,.7,.2,1) forwards}
.grow{transform-origin:left center;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards}
.orb{position:absolute;border-radius:50%;animation:drift 9s ease-in-out infinite;pointer-events:none}
.pulse{animation:pulse 1.6s ease-out infinite}
button{font-family:'DM Sans',system-ui,sans-serif;cursor:pointer}
button:focus-visible{outline:3px solid #5EE0CF;outline-offset:3px}
h1,h2{margin:0}
.eb{font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:#5EE0CF;font-weight:700}
.h2{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:48px;line-height:1.08;max-width:1040px}
.card{background:#12253B;border:1px solid #223B57;border-radius:16px;box-sizing:border-box}
.big{font-family:'Fraunces',Georgia,serif;font-weight:700;line-height:1}
.btn{min-height:44px;padding:0 22px;border-radius:999px;border:1px solid #3A5675;background:transparent;color:#EAF0F7;font-size:16px;font-weight:500}
.btn.p{border:0;background:#5EE0CF;color:#0B1626;font-weight:700}
.btn.a{border:0;background:#F4B942;color:#0B1626;font-weight:700}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.lab{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
@media (prefers-reduced-motion:reduce){.rise,.pop,.slide{animation:none;opacity:1}.grow{animation:none;transform:none}.orb,.pulse{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<div id="stage">
<div class="orb" style="right:-120px;top:-140px;width:520px;height:520px;background:radial-gradient(circle,#16405A 0%,rgba(11,22,38,0) 68%)"></div>
<div class="orb" style="left:-160px;bottom:-200px;width:520px;height:520px;background:radial-gradient(circle,#2A2A5E 0%,rgba(11,22,38,0) 68%);animation-delay:-4s"></div>
<div id="slide" style="position:relative;flex:1;min-height:0;display:flex;flex-direction:column"></div>
<div id="nav" style="position:relative;height:84px;padding:0 72px;display:flex;align-items:center;justify-content:space-between;box-sizing:border-box;gap:16px"></div>
<div id="det" style="display:none;position:absolute;left:0;top:0;right:0;bottom:0;z-index:5;background:#0B1626"></div>
<div id="dem" style="display:none;position:absolute;left:0;top:0;right:0;bottom:0;z-index:6;background:#0B1626"></div>

<script>
const AM={"s":[{"k":"A","n":"Active","as":["Segment is a UK-authorised (FCA) active, long-only manager running listed equities, fixed income and multi-asset strategies; no hedge fund, private markets or passive/index mandates in scope.","Product range includes UK-domiciled UCITS/OEICs and unit trusts plus segregated institutional mandates; some AUM may be delegated from or to overseas affiliates.","Authorised Fund Manager (ACD) role is held in-house, so the firm owns the fund's regulatory obligations, with some outsourced functions.","Fund accounting, valuation and transfer agency may be in-house or outsourced to a third-party administrator or depositary-linked provider; the chain shows the activities regardless of who performs them.","Market data, order management and execution are supported by third-party vendors and brokers; the chain describes activities, not specific vendors or systems.","Research is paid for from the firm's own P&L or a Research Payment Account in line with MiFID II unbundling rules as carried into the FCA Handbook (COBS 2.3B).","Regime references assume UK onshored/FCA rules: COBS, Consumer Duty, SM&CR, SDR and investment labels, UK Stewardship Code, UK UCITS, and UK product disclosure replacing PRIIPs KID (Consumer Composite Investments regime), with timelines treated as evolving.","Distribution is a mix of intermediated (platforms, wealth managers, advisers), institutional (pensions, consultants) and limited direct channels; retail exposure makes Consumer Duty applicable to relevant products.","The chain is a generic operating model for analyst design purposes, not drawn from any named firm, and carries no statistics or benchmarks.","Blocks are in logical sequence rather than strict time order; some (risk, compliance, governance) operate continuously alongside investment activity.","Assumes the input active.json chain is the scope; no named firm, vendor stack or statistics are used.","Autonomy levels are capped at L3 for anything touching trades, investment decisions, fund pricing sign-off or client-adverse outcomes.","Agents run in a controlled environment with read access to firm systems and write access only to draft or queue areas except at L3-L4 where stated.","Consumer product information (CCI) figures must come from a compliant calculation engine called as a tool, never generated as free text.","Only two use cases are marked sourced, because vendor pages found by web search evidence the use case type (reconciliation agent, RFP and DDQ AI); they do not prove performance and no figures are claimed.","Pre-trade checks, allocation and surveillance agents operate with SM&CR accountable function holders named as owners.","Web search results were not fully read; sourced marks rest on page titles and snippets returned by search."],"x":[["ACT-B1-4","Committee sign-off is a collective accountable human decision under product governance."],["ACT-B3-1","Strategy and positioning is an investment decision requiring portfolio manager judgement."],["ACT-B4-4","Executing and negotiating trades relies on trader judgement and counterparty relationships; routing support is covered separately."],["ACT-B7-6","Mandate negotiation is a relationship and legal judgement activity."]],"b":[{"i":"ACT-B1","n":"Product & Mandate Design","o":"F","p":"Define, approve and launch fund ranges and segregated mandates that fit target markets, regulatory expectations and the firm's investment capabilities.","a":[["ACT-B1-1","Assess market and client demand","Analyse distributor, platform and institutional demand and competitor ranges to identify gaps for new funds or strategies."],["ACT-B1-2","Define investment objective and policy","Specify objective, benchmark, universe, risk limits and constraints in the prospectus and investment management agreement terms."],["ACT-B1-3","Determine target market and distribution strategy","Identify intended investors, needs and channels under the product governance rules and Consumer Duty outcomes."],["ACT-B1-4","Run product approval committee","Present the proposition, risks, costs and operational readiness for sign-off by the product governance forum."],["ACT-B1-5","Apply SDR label and sustainability criteria","Assess eligibility for UK SDR investment labels and set sustainability objectives, naming and disclosure to avoid greenwashing."],["ACT-B1-6","Set fees and charges structure","Determine management fee, share classes and ongoing charges, testing the structure against fair value expectations."],["ACT-B1-7","Prepare fund documents and regulatory filings","Draft prospectus, product information documents and FCA authorisation submissions, with depositary and auditor engagement."],["ACT-B1-8","Review existing products and mandates","Periodically assess performance, demand, capacity and outcomes to decide whether to amend, merge or close products."]],"u":[["UC-ACT-B1-1","Demand and product review monitor",["ACT-B1-1","ACT-B1-8"],"The agent pulls platform flows, distributor feedback and competitor fund data, and clusters demand gaps and underperforming products. It drafts a periodic gap and product-health pack with evidence links for the product team.",3,"Product owner reviews exceptions and decides any amend, merge or close recommendation.",""],["UC-ACT-B1-2","Objective, policy and target market drafter",["ACT-B1-2","ACT-B1-3"],"The agent drafts the objective, benchmark, risk limits and target market statement from the product brief and prior approved templates. It checks wording against product governance and Consumer Duty outcome checklists.",2,"Product owner and compliance approve every draft before it enters the approval pack.",""],["UC-ACT-B1-3","SDR label and fair-value fee tester",["ACT-B1-5","ACT-B1-6"],"The agent tests proposed objectives and naming against SDR label criteria and flags greenwashing-risk wording. It runs the proposed fee and share class structure through the firm's fair value framework and peer data.",2,"Sustainability and pricing committees approve label choice and fees; agent output is advisory evidence only.",""],["UC-ACT-B1-4","Fund document and filing assembler",["ACT-B1-7"],"The agent assembles prospectus, product information documents and FCA submission drafts from approved clause libraries and the product record. It tracks depositary and auditor input and checks cross-document consistency.",2,"Legal and compliance review and sign off all documents before submission to the FCA.",""]]},{"i":"ACT-B2","n":"Research & Idea Generation","o":"F","p":"Generate differentiated, well-evidenced investment views on companies, issuers and macro themes that feed portfolio decisions.","a":[["ACT-B2-1","Monitor markets, news and corporate events","Track results, filings, announcements and macro data across covered securities to identify changes needing analyst attention."],["ACT-B2-2","Build and update financial models","Maintain company and issuer forecasts, valuation models and scenario analysis from reported accounts and management guidance."],["ACT-B2-3","Conduct company and management engagement","Meet management, attend results calls and site visits, and record findings to support conviction and stewardship."],["ACT-B2-4","Assess credit quality and issuer fundamentals","Analyse balance sheets, covenants, structure and spreads to form fixed income credit views and internal ratings."],["ACT-B2-5","Integrate ESG and sustainability factors","Assess financially material environmental, social and governance risks and incorporate them into research conclusions and ratings."],["ACT-B2-6","Develop macro and asset allocation views","Form house views on growth, inflation, rates, currencies and sectors for use by equity, bond and multi-asset teams."],["ACT-B2-7","Manage broker research and its budget","Select, value and pay for external research under unbundling rules, recording usage and allocating cost appropriately."],["ACT-B2-8","Publish recommendations and conviction ratings","Document investment cases and recommendations, and present to portfolio managers and investment committees for challenge."]],"u":[["UC-ACT-B2-1","Event and macro monitoring agent",["ACT-B2-1","ACT-B2-6"],"The agent watches filings, results, news and macro releases for covered securities and themes, then ranks and routes alerts with source links to the relevant analyst. It also compiles a macro data digest for the house view process.",4,"No human gate on alerting; humans own all views and the audit trail is sampled monthly by research management.",""],["UC-ACT-B2-2","Model refresh and investment case drafter",["ACT-B2-2","ACT-B2-8"],"The agent ingests reported accounts and guidance, updates model inputs in the analyst's template and flags variances to forecasts. It drafts the recommendation note and conviction rationale from the updated model and prior notes.",2,"The analyst reviews every model change and note; the analyst alone sets the recommendation and conviction rating.",""],["UC-ACT-B2-3","Credit and ESG evidence agent",["ACT-B2-4","ACT-B2-5"],"The agent extracts covenants, leverage, spread moves and material ESG controversies from filings, data vendors and news. It assembles an evidence file with a proposed internal rating factor view.",2,"Credit or ESG analyst approves the ratings and ESG conclusions before use in portfolios.",""],["UC-ACT-B2-4","Engagement notes and research budget logger",["ACT-B2-3","ACT-B2-7"],"The agent transcribes meetings and results calls, tags them to issuers and stewardship themes, and logs them in the research system. It also records broker research consumption and reconciles it to the research budget allocation.",3,"Analysts review a sample of notes; research budget payments and broker value scores are approved by the research budget owner.",""]]},{"i":"ACT-B3","n":"Portfolio Construction & Risk","o":"F","p":"Turn research views into portfolios that meet mandate objectives and constraints, with risk, liquidity and sustainability measured and controlled.","a":[["ACT-B3-1","Set strategy and positioning","Decide active bets, sector and country weights, duration and credit stance consistent with house views and mandate objectives."],["ACT-B3-2","Size positions and build target portfolios","Translate conviction into position sizes using optimisation tools, benchmark-relative limits and portfolio manager judgement."],["ACT-B3-3","Check mandate and regulatory constraints pre-trade","Test proposed trades against investment guidelines, UCITS limits, client restrictions and sustainability exclusions before orders are released."],["ACT-B3-4","Measure market and active risk","Calculate tracking error, volatility, factor exposures and stress scenarios, and report them to portfolio managers and risk committees."],["ACT-B3-5","Monitor liquidity and redemption risk","Assess time to liquidate holdings against dealing terms, run stress tests and apply liquidity management tools where required."],["ACT-B3-6","Manage counterparty and credit exposure","Set and monitor issuer, counterparty and derivatives exposure limits, including collateral and margin considerations."],["ACT-B3-7","Review performance attribution with managers","Challenge sources of return and risk through regular portfolio reviews, linking outcomes back to investment process."],["ACT-B3-8","Rebalance and handle cashflows","Invest subscriptions, fund redemptions and correct drift from model or target weights, including mandate-wide model changes."]],"u":[["UC-ACT-B3-1","Position sizing proposal agent",["ACT-B3-2"],"The agent runs the optimiser against conviction ratings, benchmark limits and risk budgets and produces candidate target portfolios with rationale. It shows the effect of each change on risk and turnover.",2,"The portfolio manager decides every position size; the agent never submits orders.",""],["UC-ACT-B3-2","Pre-trade constraint checking agent",["ACT-B3-3"],"The agent tests proposed trades against mandate guidelines, UCITS limits, client restrictions and sustainability exclusions using the rules library. It returns pass, warn or block with the clause cited and logs the result.",3,"Compliance reviews all blocks and overrides; any override needs a documented second-line approval.",""],["UC-ACT-B3-3","Risk and liquidity monitoring agent",["ACT-B3-4","ACT-B3-5","ACT-B3-6"],"The agent calculates tracking error, factor exposures, stress results, days-to-liquidate and counterparty limit usage from position and market data. It raises threshold alerts with a drafted explanation and suggested liquidity management tool checks.",3,"Risk team reviews alerts; activating liquidity management tools or changing limits needs fund board or committee approval.",""],["UC-ACT-B3-4","Attribution review and rebalance prep agent",["ACT-B3-7","ACT-B3-8"],"The agent prepares attribution commentary linking returns to process, and calculates drift and cashflow-driven rebalance candidates. It drafts the review pack and proposed rebalance lists for models and mandates.",2,"Portfolio managers challenge the review and approve all rebalance lists before release to trading.",""]]},{"i":"ACT-B4","n":"Trading & Execution","o":"F","p":"Execute portfolio decisions efficiently and fairly across asset classes while meeting best execution and market conduct obligations.","a":[["ACT-B4-1","Receive and validate portfolio orders","Capture orders from portfolio managers in the order management system and confirm instrument, size, instructions and eligibility."],["ACT-B4-2","Aggregate and allocate orders fairly","Combine orders across funds where appropriate and allocate fills according to the order allocation policy to avoid client disadvantage."],["ACT-B4-3","Select venues, brokers and algorithms","Choose execution channels and strategies to achieve the best possible result given price, cost, speed, size and liquidity."],["ACT-B4-4","Execute and negotiate trades","Work orders in equities, bonds, FX and derivatives with approved counterparties, handling block trades and illiquid securities."],["ACT-B4-5","Perform transaction cost analysis","Measure implementation shortfall and execution quality against benchmarks, and feed results into broker and venue assessments."],["ACT-B4-6","Review brokers and best execution","Score and rank counterparties periodically, document best execution monitoring and publish required execution policy disclosures."],["ACT-B4-7","Manage FX and cash hedging","Execute currency hedges and cash movements to support share class hedging, subscriptions, redemptions and settlement needs."],["ACT-B4-8","Record trade rationale and communications","Retain orders, timestamps and voice or electronic communications to meet record-keeping and market abuse surveillance requirements."]],"u":[["UC-ACT-B4-1","Order validation and fair allocation agent",["ACT-B4-1","ACT-B4-2"],"The agent checks incoming orders for instrument, size, eligibility and instruction completeness in the OMS, and proposes aggregation. It applies the order allocation policy to fills and flags departures.",3,"The dealing desk reviews exceptions and a sample of allocations; any deviation from policy needs compliance sign-off.",""],["UC-ACT-B4-2","Execution routing and hedge proposal agent",["ACT-B4-3","ACT-B4-7"],"The agent recommends venues, brokers and algorithms using order characteristics, liquidity data and prior TCA. It also drafts FX hedge and cash movement proposals from share class exposures and dealing flows.",2,"The trader approves each routing choice and hedge; the agent does not place orders.",""],["UC-ACT-B4-3","Transaction cost and broker scoring agent",["ACT-B4-5","ACT-B4-6"],"The agent computes implementation shortfall and execution quality against benchmarks and joins results to broker and venue data. It drafts broker scorecards and best execution monitoring evidence.",3,"The best execution committee reviews outliers and approves broker rankings and policy disclosures.",""],["UC-ACT-B4-4","Trade record and communications archiver",["ACT-B4-8"],"The agent captures order timestamps, linked electronic and voice communications and trade rationale into the retention system with indexing. It checks for missing records and files completeness reports.",4,"No pre-approval needed; compliance samples completeness reports quarterly and the agent's audit trail is immutable.",""]]},{"i":"ACT-B5","n":"Middle Office: Trade Support, Compliance & Performance","o":"M","p":"Confirm, monitor and measure what the front office has done, ensuring trades settle, rules are followed and returns are accurately reported.","a":[["ACT-B5-1","Capture and enrich executed trades","Book fills into the portfolio system with allocations, fees and standing settlement instructions ready for matching."],["ACT-B5-2","Match and confirm trades with counterparties","Match broker confirmations and settlement details and resolve breaks before the intended settlement date."],["ACT-B5-3","Manage settlement fails and corporate actions","Chase failed settlements, process dividends, rights issues and mergers, and communicate elections to custodians and portfolio managers."],["ACT-B5-4","Reconcile positions and cash with custodians","Compare internal books of record to custodian and administrator positions and cash, investigating and resolving differences daily."],["ACT-B5-5","Monitor post-trade compliance and breaches","Check holdings against investment restrictions and regulatory limits, escalate breaches and document remediation and client notification."],["ACT-B5-6","Run market abuse and conflicts surveillance","Review trading activity, personal account dealing and inducements, and submit suspicious transaction reports where required."],["ACT-B5-7","Calculate performance and attribution","Produce time-weighted returns, benchmark-relative results and attribution by sector, issuer and currency, with data validation."],["ACT-B5-8","Report transactions and regulatory returns","Prepare transaction reports and other UK regulatory returns, such as position and fund statistics, to the FCA and Bank of England."]],"u":[["UC-ACT-B5-1","Trade matching and settlement break agent",["ACT-B5-1","ACT-B5-2","ACT-B5-3"],"The agent books fills with allocations and standing settlement instructions, matches broker confirmations and investigates breaks and fails. It drafts corporate action election notices from custodian announcements.",3,"Operations reviews unresolved breaks and a sample of bookings; elections on corporate actions need portfolio manager approval.",""],["UC-ACT-B5-2","Position and cash reconciliation agent",["ACT-B5-4"],"The agent compares internal books to custodian and administrator positions and cash, classifies breaks by cause and proposes fixes. It chases data sources and tracks ageing.",3,"Operations approves adjusting entries and reviews aged or high-value breaks.","https://www.arcesium.com/blog/real-time-reconciliation-agent"],["UC-ACT-B5-3","Post-trade compliance and surveillance agent",["ACT-B5-5","ACT-B5-6"],"The agent checks holdings against restrictions and regulatory limits, and scans trades, personal account dealing and inducements for conflict and market abuse patterns. It drafts breach and alert case files with evidence.",3,"Compliance decides whether a breach or suspicious transaction is reported or clients notified.",""],["UC-ACT-B5-4","Performance and regulatory return agent",["ACT-B5-7","ACT-B5-8"],"The agent calculates returns and attribution with data validation and prepares transaction reports and fund statistics returns from booked data. It reconciles outputs to source and flags anomalies.",3,"Performance and regulatory reporting teams review exceptions and approve submissions to the FCA and Bank of England.",""]]},{"i":"ACT-B6","n":"Fund Accounting, Valuation & Transfer Agency","o":"B","p":"Value funds accurately, maintain the investor register and process dealing so unit holders are priced and treated correctly.","a":[["ACT-B6-1","Price securities and review valuations","Source prices, challenge stale or unusual values and apply fair value adjustments through the valuation committee when markets are unreliable."],["ACT-B6-2","Calculate daily net asset values","Produce fund and share class NAVs including accruals, income, fees, FX and swing pricing or dilution adjustments."],["ACT-B6-3","Process investor dealing and register","Accept subscriptions, redemptions and switches, update the unit holder register, and manage dealing cut-offs and cash settlement."],["ACT-B6-4","Perform investor AML and KYC checks","Verify identity and source of funds, screen sanctions and politically exposed persons, and refresh periodically in line with money laundering rules."],["ACT-B6-5","Calculate and distribute income","Determine distributable income, equalisation and payment or reinvestment, and issue tax vouchers to investors."],["ACT-B6-6","Oversee the depositary and administrator","Hold service providers to account through service level monitoring, depositary oversight reports and reviews of delegated functions."],["ACT-B6-7","Manage tax, withholding and reclaims","Apply withholding tax rates, file reclaims and meet fund and investor tax reporting obligations across jurisdictions."],["ACT-B6-8","Produce fund accounts and audit support","Prepare annual and interim reports, coordinate with auditors and resolve pricing errors, including compensating affected investors where necessary."]],"u":[["UC-ACT-B6-1","Price challenge and NAV check agent",["ACT-B6-1","ACT-B6-2"],"The agent sources prices from multiple feeds, flags stale or unusual values, and runs NAV tolerance, accrual and swing checks. It drafts fair value papers with evidence for the valuation committee.",2,"Fund accounting and the valuation committee approve fair value adjustments and sign off each NAV.",""],["UC-ACT-B6-2","Investor dealing and AML KYC agent",["ACT-B6-3","ACT-B6-4"],"The agent validates dealing instructions against cut-offs and register data, and verifies identity, source of funds, sanctions and PEP screening results. It prepares exception queues and periodic refresh tasks.",3,"AML staff decide on any rejection, escalation or suspicious activity report; investors are never declined by the agent.",""],["UC-ACT-B6-3","Income distribution and tax reclaim agent",["ACT-B6-5","ACT-B6-7"],"The agent calculates distributable income and equalisation proposals, and identifies withholding tax rates and reclaim opportunities from holdings and treaty data. It prepares reclaim filings and tax voucher data.",3,"Tax and fund accounting teams approve distribution amounts and review reclaim filings and exceptions.",""],["UC-ACT-B6-4","Provider oversight and accounts agent",["ACT-B6-6","ACT-B6-8"],"The agent monitors administrator and depositary SLAs, reports and findings, and drafts oversight packs. It assembles interim and annual report drafts and traces pricing error investigations for audit.",2,"Oversight owner approves findings; any investor compensation decision and final accounts need senior sign-off.",""]]},{"i":"ACT-B7","n":"Distribution & Client Onboarding","o":"D","p":"Win, qualify and onboard institutional, intermediary and retail-facing clients so that products reach their intended target market.","a":[["ACT-B7-1","Build pipeline and manage intermediary relationships","Maintain coverage of platforms, wealth managers, advisers and consultants, tracking opportunities, buy lists and sales activity."],["ACT-B7-2","Respond to RFPs and due diligence requests","Complete consultant questionnaires, ESG and operational due diligence requests, and tender responses using approved, current content."],["ACT-B7-3","Approve financial promotions","Review marketing materials for fair, clear and not misleading content and for SDR label consistency before release."],["ACT-B7-4","Exchange target market and distributor data","Share product governance information with distributors and gather feedback on sales, complaints and outcomes for the target market."],["ACT-B7-5","Classify clients and assess suitability","Categorise clients as retail, professional or eligible counterparty and confirm appropriateness for direct or segregated mandate relationships."],["ACT-B7-6","Negotiate and document mandates","Agree investment management agreements, guidelines, fees and reporting terms with institutional clients and complete legal review."],["ACT-B7-7","Onboard clients and open accounts","Collect documentation, run KYC and sanctions checks, set up accounts and custody arrangements, and brief operations and portfolio teams."],["ACT-B7-8","Manage platform and fund-supermarket onboarding","Set up fund data, share classes and rebate arrangements with platforms and keep product data feeds accurate."]],"u":[["UC-ACT-B7-1","Distributor coverage and data feed agent",["ACT-B7-1","ACT-B7-4","ACT-B7-8"],"The agent consolidates CRM, platform and buy-list data into account briefs and checks that fund data and share class feeds to platforms match the product record. It collects distributor target market feedback and flags issues.",3,"Sales and product data owners review exceptions and approve any change to published fund data.",""],["UC-ACT-B7-2","RFP and DDQ response agent",["ACT-B7-2"],"The agent matches questions to the approved content library, drafts answers with citations and highlights stale or unsupported content. It assembles the response pack in the consultant's format.",2,"Subject matter owners approve each answer and compliance approves any new claims.","https://www.responsive.io/blog/how-5-asset-managers-use-ai-for-rfps-ddqs-and-knowledge-management"],["UC-ACT-B7-3","Financial promotion pre-review agent",["ACT-B7-3"],"The agent checks marketing drafts for fair, clear and not misleading issues, required risk warnings, performance presentation and SDR label consistency. It returns an annotated review with rule references.",2,"A qualified compliance approver signs off every financial promotion before release.",""],["UC-ACT-B7-4","Client classification and onboarding agent",["ACT-B7-5","ACT-B7-7"],"The agent collects and validates onboarding documents, proposes client categorisation, runs KYC and sanctions checks and prepares account setup tasks. It generates the operations and portfolio team handover brief.",3,"Compliance approves classification and any high-risk client; onboarding teams review exceptions.",""]]},{"i":"ACT-B8","n":"Client Reporting & Servicing","o":"D","p":"Keep clients informed and well served through accurate reporting, value assessment and responsive handling of queries and complaints.","a":[["ACT-B8-1","Produce client and fund factsheets","Generate monthly factsheets with performance, holdings, risk and cost data, reviewed for accuracy and promotional compliance."],["ACT-B8-2","Prepare periodic mandate reports","Deliver tailored valuations, performance, attribution and commentary to institutional clients to the agreed format and frequency."],["ACT-B8-3","Maintain product information documents","Prepare and update UK consumer product disclosures, including costs, risk and performance scenarios, replacing the PRIIPs KID."],["ACT-B8-4","Run Consumer Duty value assessments","Assess whether each fund's charges are justified by benefits, evidence outcomes and prepare the annual assessment of value report."],["ACT-B8-5","Prepare investment and market commentary","Write portfolio manager commentary and thought leadership explaining positioning and performance in clear, balanced language."],["ACT-B8-6","Respond to client queries and data requests","Answer questions on holdings, performance, fees and ESG data, including ad hoc and regulatory data requests."],["ACT-B8-7","Hold client meetings and reviews","Prepare and run periodic reviews with institutional clients and consultants, tracking actions and changes to guidelines."],["ACT-B8-8","Handle complaints and monitor consumer outcomes","Log and resolve complaints, analyse root causes and test consumer understanding and support outcomes as required by Consumer Duty."]],"u":[["UC-ACT-B8-1","Factsheet and product information agent",["ACT-B8-1","ACT-B8-3"],"The agent assembles monthly factsheets from approved data and builds consumer product information documents by calling the compliant calculation engine for cost, risk and performance scenarios. It never writes these figures as free text and checks consistency with fund records.",2,"Product and compliance reviewers approve each document before publication.",""],["UC-ACT-B8-2","Mandate report and commentary drafter",["ACT-B8-2","ACT-B8-5"],"The agent produces tailored valuation, performance and attribution reports and drafts portfolio manager commentary from approved data and PM notes. It checks tone for balance and consistency with positioning.",2,"The portfolio manager approves all commentary and the client team reviews each report before sending.",""],["UC-ACT-B8-3","Client query and meeting prep agent",["ACT-B8-6","ACT-B8-7"],"The agent answers data requests by querying holdings, performance, fee and ESG data and drafts responses with sources. It prepares review meeting packs and tracks actions and guideline changes.",2,"The client servicing lead approves every external response and meeting pack.",""],["UC-ACT-B8-4","Consumer Duty outcomes and complaints agent",["ACT-B8-4","ACT-B8-8"],"The agent compiles value assessment evidence on charges, costs and benefits, and clusters complaints and distributor feedback to find root causes. It drafts the annual assessment of value and outcomes monitoring reports.",2,"Governance forum and the Consumer Duty champion approve the assessment and any remediation, including any redress.",""]]},{"i":"ACT-B9","n":"Governance, Regulatory & Stewardship","o":"X","p":"Provide the oversight, control framework and stewardship that keep the firm compliant, accountable and aligned with client interests.","a":[["ACT-B9-1","Operate SM&CR responsibilities and certification","Maintain the responsibilities map, statements of responsibility, annual certification and conduct rules training for senior managers and staff."],["ACT-B9-2","Run risk and compliance monitoring programme","Execute the risk-based monitoring plan, test key controls, track findings and report to the board and risk committees."],["ACT-B9-3","Oversee fund board and ACD governance","Prepare board packs, independent director challenge and fund-level decisions on value, valuation, conflicts and liquidity."],["ACT-B9-4","Execute voting and engagement as stewards","Apply the voting policy at company meetings, engage with issuers on material issues, and record escalation and outcomes."],["ACT-B9-5","Produce UK Stewardship Code report","Compile evidence of stewardship activities and outcomes for the annual report submitted to the Financial Reporting Council."],["ACT-B9-6","Manage operational resilience and outsourcing","Map important business services, set impact tolerances, test scenarios, and oversee third-party and critical supplier risk."],["ACT-B9-7","Maintain sustainability and climate disclosures","Prepare entity and product climate-related and SDR disclosures and keep supporting data, methodologies and claims evidenced."],["ACT-B9-8","Monitor regulatory change and report to regulators","Track FCA and government policy developments, assess impacts, update policies and handle notifications, attestations and regulatory enquiries."]],"u":[["UC-ACT-B9-1","Regulatory change and SM&CR agent",["ACT-B9-1","ACT-B9-8"],"The agent scans FCA and government publications, maps changes to policies and responsibilities, and tracks certification, training and attestation status. It drafts impact assessments and policy update proposals.",3,"Compliance owners review impact assessments; senior managers sign statements of responsibility and attestations.",""],["UC-ACT-B9-2","Controls testing and board pack agent",["ACT-B9-2","ACT-B9-3"],"The agent runs control tests over system and ticket data, tracks findings and drafts monitoring reports and board or ACD pack content. It assembles value, valuation, conflict and liquidity papers from source reports.",2,"Compliance and the fund board secretary review all content; independent directors and the board make decisions.",""],["UC-ACT-B9-3","Voting and stewardship evidence agent",["ACT-B9-4","ACT-B9-5"],"The agent applies the voting policy to meeting agendas to propose vote recommendations with rationale and logs engagement and escalation outcomes. It compiles evidence for the annual Stewardship Code report.",2,"The stewardship team approves every vote and all report claims, especially votes against policy.",""],["UC-ACT-B9-4","Resilience and disclosure evidence agent",["ACT-B9-6","ACT-B9-7"],"The agent maintains important business service maps and supplier risk data, and drafts scenario test evidence. It gathers data lineage and methodology evidence for climate and SDR disclosures and flags unsupported claims.",3,"Operational resilience and sustainability owners review exceptions and sign off disclosures and impact tolerances.",""]]}],"rg":{"d":["UCITS","Consumer Duty","SDR","PRIIPs / CCI","MiFID / COBS"],"c":["SM&CR","Operational resilience"]}},{"k":"P","n":"Passive/ETF","as":["Analyst design from general knowledge; no web research, no firm-specific or statistical claims.","Archetype is a UK-domiciled manager running index funds and UCITS ETFs listed on the LSE, with outsourced administration, custody and securities lending agent.","Replication may be physical (full or sampled); synthetic swap-based funds are noted but not modelled separately.","Authorised participants and market makers are external counterparties; manager runs the primary-market process.","Index providers are third parties; manager is a licensee, not an index owner.","Stewardship is centralised in-house with proxy adviser support.","Regulatory references (COBS, Consumer Duty, CCI, UK Stewardship Code, SDR, UCITS, COLL) are indicative and should be validated before client use.","Activities describe current-state human work only; agentic use cases deferred to a later step.","Block 7 sits in Distribution; Stewardship is tagged Cross-cutting alongside Regulatory.","Archetype is a UK-domiciled passive manager running index funds and UCITS ETFs on the LSE, with outsourced administration, custody and lending agent (per input).","Administrator-performed activities (daily NAV calculation) are treated as outside the manager's agent scope and listed under no_fit.","All performance, cost and product information figures come from a compliant calculation engine; agents never generate such numbers as free text.","Autonomy levels are analyst proposals; no creation or redemption acceptance, trade, index or NAV sign-off, or client-adverse outcome exceeds L3.","Only two use cases are marked sourced, based on public articles found by web search matching the use-case topic (agentic voluntary corporate actions; policy-first proxy voting analysis); the rest are analyst design.","Regulatory references are indicative and need validation before client use. No ROI figures are claimed."],"x":[["PAS-B1-3","Commercial negotiation with index providers requires human judgement and relationship."],["PAS-B1-8","Product committee sign-off is an accountable human decision under governance and SM&CR."],["PAS-B3-8","Market maker agreements and relationships require human negotiation and judgement."],["PAS-B4-1","Lending policy and fee split are board-level decisions requiring human judgement."],["PAS-B6-2","Daily NAV is calculated by the administrator; manager only oversees exceptions (see PAS-B6-7)."],["PAS-B8-1","Stewardship and voting policy setting is a human, board-endorsed judgement."]],"b":[{"i":"PAS-B1","n":"Product & Index Design/Licensing","o":"F","p":"Decide which index-tracking products to launch, which benchmarks to license and how each is structured, priced and authorised.","a":[["PAS-B1-1","Assess product demand and gaps","Analyse client demand, competitor fee levels and range gaps to shortlist new index funds and ETFs."],["PAS-B1-2","Select and benchmark candidate indices","Evaluate index methodology, constituent liquidity, capacity and replicability against the intended exposure."],["PAS-B1-3","Negotiate index licence terms","Agree licence scope, fee basis, usage rights, data redistribution and ETF naming terms with index providers."],["PAS-B1-4","Set replication and structure approach","Choose physical full, optimised sampling or synthetic replication and UCITS or UK-authorised fund structure."],["PAS-B1-5","Prepare FCA authorisation and listing","Compile fund authorisation documents and LSE admission to trading for UCITS ETF share classes."],["PAS-B1-6","Define target market and fee level","Set target market, share classes and ongoing charge under COBS product governance rules."],["PAS-B1-7","Draft prospectus and CCI documents","Produce prospectus, key information documents and product information consistent with consumer-understanding requirements."],["PAS-B1-8","Approve launch through product committee","Obtain product governance sign-off covering fair value, operational readiness and index licence conditions before launch."]],"u":[["UC-PAS-B1-1","Product gap and fee benchmark scout",["PAS-B1-1","PAS-B1-6"],"Pulls platform flow data, competitor fee tables and range inventory to rank candidate funds and share-class fee levels. Produces a gap analysis with target-market hypotheses for the product team.",1,"Product head decides which funds and fee levels to pursue; agent output is advisory only.",""],["UC-PAS-B1-2","Index screening and replicability assessor",["PAS-B1-2","PAS-B1-4"],"Reads index methodology documents and constituent files, then tests liquidity, capacity and sampling feasibility with a tracking simulation tool. Recommends replication approach and UCITS or UK fund structure with rationale.",2,"Investment and structuring leads approve every index and structure recommendation before it is progressed.",""],["UC-PAS-B1-3","Authorisation and listing pack assembler",["PAS-B1-5"],"Assembles FCA authorisation and LSE admission documents from templates, prior filings and fund terms, and runs consistency checks across them. Tracks open items and draft submission status.",2,"Legal and compliance review and approve each document before anything is submitted.",""],["UC-PAS-B1-4","Prospectus and CCI document drafter",["PAS-B1-7"],"Drafts prospectus and key information sections from approved fund terms, and pulls all product cost and performance figures from the compliant calculation engine rather than generating them as free text. Flags wording that departs from approved language libraries.",2,"Compliance and product governance approve every draft; numeric product information is never agent-authored.",""]]},{"i":"PAS-B2","n":"Portfolio Replication & Rebalancing","o":"M","p":"Hold each fund in line with its index through replication, cash management and controlled rebalancing.","a":[["PAS-B2-1","Ingest index constituent and weight files","Receive and reconcile daily and rebalance index files, weights and share-count data from providers."],["PAS-B2-2","Generate model portfolio","Convert index weights into target holdings reflecting fund size, replication method and investment restrictions."],["PAS-B2-3","Optimise sampling and basket selection","Select representative holdings for sampled funds balancing tracking error, liquidity and transaction costs."],["PAS-B2-4","Compute rebalance trade lists","Derive buy and sell orders for index changes, cash flows and drift against target holdings."],["PAS-B2-5","Manage cash and futures overlay","Control residual cash, dividends and subscriptions, using index futures to limit cash drag."],["PAS-B2-6","Monitor holdings against limits","Check UCITS concentration, issuer and liquidity limits, and fund-specific mandate restrictions before and after trading."],["PAS-B2-7","Handle constituent restrictions and substitutions","Manage non-tradable, suspended or restricted securities with approved proxies and documented exceptions."],["PAS-B2-8","Reconcile positions with custodian","Match portfolio holdings and cash with custodian and administrator records daily and investigate breaks."]],"u":[["UC-PAS-B2-1","Index file ingestion and validation agent",["PAS-B2-1"],"Collects daily and rebalance files from index providers, parses and validates weights and share counts, and reconciles against prior files and vendor data. Logs every check and quarantines anomalies.",4,"Humans review only quarantined anomalies; all actions and checks are logged for audit.",""],["UC-PAS-B2-2","Model portfolio and sampling optimiser",["PAS-B2-2","PAS-B2-3"],"Converts validated index weights into target holdings using fund size, restrictions and an optimisation library to select sampled baskets. Reports expected tracking error, liquidity and cost trade-offs.",2,"Portfolio manager reviews and approves each model portfolio and basket before release to trading.",""],["UC-PAS-B2-3","Rebalance trade list and cash overlay planner",["PAS-B2-4","PAS-B2-5"],"Compares holdings with targets, forecasts cash flows and dividends, and drafts rebalance trade lists and futures overlay proposals. Shows cash drag and cost estimates per option.",2,"Portfolio manager approves every trade list and futures overlay; no order is released by the agent.",""],["UC-PAS-B2-4","Limit, restriction and custodian break monitor",["PAS-B2-6","PAS-B2-7","PAS-B2-8"],"Runs pre- and post-trade UCITS and mandate limit checks, reconciles holdings and cash with custodian files, and proposes approved proxies for restricted securities. Opens and tracks break tickets.",3,"Humans review limit alerts and breaks; any substitution or exception requires explicit approval and documentation.",""]]},{"i":"PAS-B3","n":"Trading, Creation/Redemption & Market Making Support","o":"M","p":"Execute portfolio trades and operate the primary-market creation and redemption process with authorised participants.","a":[["PAS-B3-1","Onboard and review authorised participants","Maintain AP agreements, due diligence, counterparty limits and eligibility for creation and redemption."],["PAS-B3-2","Publish daily creation basket","Determine and distribute the portfolio composition file and cash components for the day's creations."],["PAS-B3-3","Process creation and redemption orders","Receive, validate and accept AP orders against cut-offs, basket composition and fund capacity."],["PAS-B3-4","Settle in-kind and cash transfers","Coordinate securities and cash delivery with custodian and CREST or international settlement systems."],["PAS-B3-5","Execute and allocate portfolio trades","Route trades to brokers and venues, then allocate fills across funds with best execution evidence."],["PAS-B3-6","Calculate indicative NAV for market makers","Provide intraday indicative NAV data so market makers can price ETF shares on LSE."],["PAS-B3-7","Monitor ETF premium, discount and spreads","Track secondary-market pricing, spreads and trading volumes against NAV and escalate dislocations."],["PAS-B3-8","Support market makers and venue obligations","Maintain market maker agreements, liquidity provision monitoring and LSE listing requirements."]],"u":[["UC-PAS-B3-1","Authorised participant due diligence monitor",["PAS-B3-1"],"Refreshes AP due diligence from agreements, credit data and adverse news, and tracks counterparty limits and eligibility. Drafts review notes for the counterparty committee.",2,"Counterparty committee approves AP onboarding, limit changes and eligibility.",""],["UC-PAS-B3-2","Creation basket and order validation agent",["PAS-B3-2","PAS-B3-3"],"Builds the daily creation basket and cash component from model holdings and distributes the file after approval. Validates incoming AP orders against cut-offs, basket and capacity and prepares an accept or reject recommendation.",2,"Authorised dealing staff approve the basket and personally accept or reject each creation or redemption order.",""],["UC-PAS-B3-3","Settlement and trade allocation agent",["PAS-B3-4","PAS-B3-5"],"Matches in-kind and cash settlement instructions with custodian and CREST status, chases fails, and compiles best execution evidence and fill allocations across funds. Raises exceptions for failed or unmatched items.",3,"Dealers review exceptions and sampled allocations; trade routing decisions remain with traders.",""],["UC-PAS-B3-4","Indicative NAV and premium-discount monitor",["PAS-B3-6","PAS-B3-7"],"Computes intraday indicative NAV from holdings, FX and prices, and tracks LSE price, spread and volume against it. Flags dislocations with context for the desk.",3,"Capital markets desk reviews flagged dislocations and decides any escalation to market makers or the board.",""]]},{"i":"PAS-B4","n":"Securities Lending & Collateral","o":"M","p":"Earn incremental fund return from lending holdings while controlling counterparty, collateral and recall risk.","a":[["PAS-B4-1","Set lending policy and fee split","Define lendable assets, revenue split with the fund and programme limits, disclosed in fund documents."],["PAS-B4-2","Appoint and oversee lending agent","Review agent performance, indemnity, revenue reporting and operational controls against the agreement."],["PAS-B4-3","Approve borrowers and counterparty limits","Assess borrower credit quality and set exposure limits and eligible borrower lists."],["PAS-B4-4","Define eligible collateral and haircuts","Set acceptable collateral types, concentration, haircuts and margin levels meeting UCITS and FCA rules."],["PAS-B4-5","Monitor loan book and utilisation","Track on-loan balances, demand, fees and concentration by security, borrower and fund."],["PAS-B4-6","Manage recalls for votes and rebalances","Recall securities ahead of corporate action deadlines, index changes and proxy votes where required."],["PAS-B4-7","Mark collateral and manage margin calls","Value collateral daily, call or return margin and reconcile movements with the agent and triparty provider."],["PAS-B4-8","Report lending revenue and risk","Produce lending revenue, collateral and exposure reports for committees, annual reports and fund disclosures."]],"u":[["UC-PAS-B4-1","Borrower credit and collateral eligibility monitor",["PAS-B4-3","PAS-B4-4"],"Monitors borrower credit signals, exposure and collateral concentration against policy and UCITS limits. Drafts proposed limit or haircut changes with evidence.",2,"Risk committee approves any borrower, limit or haircut change.",""],["UC-PAS-B4-2","Loan book and lending agent oversight agent",["PAS-B4-2","PAS-B4-5"],"Ingests agent loan and revenue files, tracks utilisation, fees and concentration, and tests them against the agreement and indemnity terms. Reports deviations and performance trends.",3,"Securities lending oversight team reviews exceptions and decides any escalation to the agent.",""],["UC-PAS-B4-3","Recall and vote-linked recall coordinator",["PAS-B4-6","PAS-B8-7"],"Cross-checks the corporate action, index event and proxy meeting calendars against on-loan positions and raises recall requests to the lending agent under policy. Confirms recall settlement before record dates.",3,"Lending and stewardship teams review recall exceptions and approve any non-policy recall.",""],["UC-PAS-B4-4","Margin, collateral and lending reporting agent",["PAS-B4-7","PAS-B4-8"],"Values collateral daily, reconciles margin movements with the agent and triparty provider, and drafts lending revenue and risk reports for committees and fund disclosures. Highlights breaks and unusual movements.",3,"Operations staff review margin breaks; reports to committees and disclosures are approved by the head of lending.",""]]},{"i":"PAS-B5","n":"Corporate Actions & Index Events","o":"M","p":"Capture and process corporate actions and index events so fund holdings track the benchmark correctly.","a":[["PAS-B5-1","Capture corporate action announcements","Collect mandatory and voluntary event notices from data vendors, custodians and issuers into one record."],["PAS-B5-2","Cross-reference index provider treatment","Compare each event with the index provider's announced treatment to determine required fund action."],["PAS-B5-3","Decide elections on voluntary events","Select election options for tenders, rights and scrip dividends consistent with index treatment and approval."],["PAS-B5-4","Instruct custodians before deadlines","Send elections and instructions to custodians and track acknowledgement against market deadlines."],["PAS-B5-5","Process mergers, spin-offs and delistings","Adjust holdings for structural events and manage resulting securities and cash in line with index rules."],["PAS-B5-6","Track index review and rebalance calendar","Maintain schedule of index reviews, reconstitutions and effective dates and prepare funds in advance."],["PAS-B5-7","Reconcile entitlements and income","Match expected dividends, entitlements and withholding tax to receipts and chase shortfalls."],["PAS-B5-8","Reclaim withholding tax","Prepare and submit treaty-rate reclaims and monitor recoveries across markets."]],"u":[["UC-PAS-B5-1","Corporate action capture and consolidation agent",["PAS-B5-1"],"Collects notices from data vendors, custodians and issuer feeds, de-duplicates them and builds a golden record per event. Flags conflicting terms between sources.",4,"Humans review only flagged source conflicts; the full audit trail of captured data is retained.",""],["UC-PAS-B5-2","Voluntary event election drafting agent",["PAS-B5-2","PAS-B5-3","PAS-B5-4"],"Compares each event with the index provider's announced treatment, drafts the election with rationale, and prepares custodian instructions with deadline tracking. Tracks acknowledgements.",2,"Corporate actions specialist approves each election and instruction before it is sent to the custodian.","https://www.sia-partners.com/en/insights/publications/modernizing-voluntary-corporate-actions-with-agentic-ai-workflow"],["UC-PAS-B5-3","Structural event and index calendar agent",["PAS-B5-5","PAS-B5-6"],"Maintains the index review and reconstitution calendar and models holdings changes from mergers, spin-offs and delistings per index rules. Proposes position adjustments and prepares funds ahead of effective dates.",3,"Portfolio operations review exceptions and sampled adjustments; complex or ambiguous events need manual approval.",""],["UC-PAS-B5-4","Income reconciliation and tax reclaim agent",["PAS-B5-7","PAS-B5-8"],"Matches expected entitlements and withholding tax against receipts, chases shortfalls and compiles treaty-rate reclaim claims from custodian and tax data. Tracks recovery status by market.",3,"Tax and operations staff review exceptions and sign off each claim before submission.",""]]},{"i":"PAS-B6","n":"Fund Accounting, NAV & Tracking Error","o":"B","p":"Produce accurate fund valuations and measure how closely each fund follows its benchmark.","a":[["PAS-B6-1","Price holdings and validate prices","Obtain closing prices and FX rates, then challenge stale or anomalous valuations before NAV."],["PAS-B6-2","Calculate daily NAV","Administrator computes NAV per share from holdings, accruals, income and share capital movements."],["PAS-B6-3","Reconcile cash, trades and positions","Resolve breaks between the fund's books, custodian, transfer agent and prime or lending agents."],["PAS-B6-4","Accrue fees, costs and income","Book management fee, expenses, dividends and lending income per fund terms and expense caps."],["PAS-B6-5","Measure tracking difference and error","Calculate gross and net tracking difference and error versus the index on defined periods."],["PAS-B6-6","Attribute tracking drivers","Decompose deviation into fees, cash drag, sampling, trading costs, tax and lending income."],["PAS-B6-7","Investigate and sign off NAV exceptions","Review tolerance breaches, pricing errors and breaks, and approve corrections and compensation where needed."],["PAS-B6-8","Produce fund financial statements","Prepare annual and interim reports and distribution calculations for audit and publication."]],"u":[["UC-PAS-B6-1","Price validation and stale price agent",["PAS-B6-1"],"Compares vendor prices and FX rates with prior values, peers and index data to detect stale or anomalous valuations before NAV. Assembles evidence for each challenge to the pricing source.",3,"Valuation team reviews flagged prices and decides any override or challenge.",""],["UC-PAS-B6-2","Reconciliation and accrual checker",["PAS-B6-3","PAS-B6-4"],"Matches books against custodian, transfer agent and lending agent records and recalculates fee, expense and income accruals against fund terms and caps. Classifies breaks and suggests resolutions.",3,"Fund accounting staff review break exceptions and sampled accruals; adjustments are approved by humans.",""],["UC-PAS-B6-3","Tracking difference and attribution agent",["PAS-B6-5","PAS-B6-6"],"Runs tracking difference and error from validated NAV and index data in the calculation engine, and decomposes drivers such as fees, cash drag and sampling. Drafts commentary for board and client use.",3,"Index portfolio manager reviews drivers and commentary; published figures come only from the calculation engine.",""],["UC-PAS-B6-4","NAV exception triage and report drafting agent",["PAS-B6-7","PAS-B6-8"],"Investigates tolerance breaches by tracing pricing, reconciliation and accrual evidence, and proposes corrections. Also drafts interim and annual report sections and distribution schedules.",2,"Authorised signatories approve every NAV correction, compensation decision and published financial statement.",""]]},{"i":"PAS-B7","n":"Distribution, Platform & Client Servicing","o":"D","p":"Reach UK advisers, platforms and institutions and service them in a way that meets Consumer Duty outcomes.","a":[["PAS-B7-1","Maintain platform and wrapper availability","Ensure share classes are listed, rated and operational on UK platforms, ISAs and SIPPs."],["PAS-B7-2","Respond to RFPs and due diligence","Complete institutional and fund-selector questionnaires covering replication, liquidity, costs and operations."],["PAS-B7-3","Publish factsheets and fund data","Distribute daily and monthly data, factsheets and portfolio holdings to platforms, vendors and websites."],["PAS-B7-4","Conduct Consumer Duty value assessments","Assess charges versus benefits for each fund and share class, evidencing fair value to the board."],["PAS-B7-5","Monitor consumer understanding and outcomes","Review distributor feedback, complaints, product information readability and outcome data against Consumer Duty."],["PAS-B7-6","Share distributor information","Provide target market, costs and charges data (including MiFID or PROD information) to distributors."],["PAS-B7-7","Manage approved communications","Review marketing, investor materials and website content to meet COBS fair, clear and not misleading rules."],["PAS-B7-8","Service distributors and investors","Handle queries, dealing issues, tax documents and relationship reporting for platforms, advisers and institutions."]],"u":[["UC-PAS-B7-1","Platform availability and distributor servicing agent",["PAS-B7-1","PAS-B7-8"],"Checks share class status and ratings across platforms, ISAs and SIPPs, and triages distributor queries and dealing issues using fund and operations data. Drafts responses and opens tickets.",3,"Client service staff review exceptions and sampled responses; complaints and client-adverse issues are handled by humans.",""],["UC-PAS-B7-2","RFP and due diligence response agent",["PAS-B7-2"],"Retrieves answers from an approved response library and fund documents to draft questionnaire responses. Highlights gaps and out-of-date answers.",2,"Product specialists and compliance approve every response before it is sent.",""],["UC-PAS-B7-3","Factsheet and distributor data publishing agent",["PAS-B7-3","PAS-B7-6"],"Builds factsheets, holdings files and target market and cost data packs from approved sources, with all numbers drawn from the compliant calculation engine. Runs completeness and consistency checks across channels.",3,"Product control reviews exceptions and a sample of outputs; any change to target market or cost data needs approval.",""],["UC-PAS-B7-4","Value, outcomes and communications review agent",["PAS-B7-4","PAS-B7-5","PAS-B7-7"],"Assembles charges-versus-benefits evidence for value assessments, analyses complaints and readability, and checks draft communications against fair, clear and not misleading criteria. Prepares findings for the board and approvers.",2,"Fair value committee and compliance approve all assessments and every communication before use.",""]]},{"i":"PAS-B8","n":"Stewardship & Voting","o":"X","p":"Exercise ownership rights across thousands of holdings in line with policy, using engagement and voting as the main active lever.","a":[["PAS-B8-1","Set stewardship and voting policy","Define voting principles, escalation approach and thematic priorities in line with UK Stewardship Code principles."],["PAS-B8-2","Receive and reconcile proxy ballots","Collect meeting notices and ballots by holding date and confirm share positions eligible to vote."],["PAS-B8-3","Analyse resolutions against policy","Compare proposals to policy and proxy adviser research, identifying contentious items needing review."],["PAS-B8-4","Decide and lodge votes","Record rationale for non-standard votes and submit instructions through the voting platform before deadlines."],["PAS-B8-5","Prioritise and conduct engagement","Select companies for engagement based on holdings size, risk and themes and track dialogue and outcomes."],["PAS-B8-6","Oversee proxy advisers and service providers","Monitor adviser quality, conflicts and custom policy implementation through periodic reviews."],["PAS-B8-7","Manage stock recalls for voting","Coordinate with lending teams to recall shares for important votes under policy."],["PAS-B8-8","Report to clients and the FRC","Publish voting records, engagement case studies and the annual UK Stewardship Code report."]],"u":[["UC-PAS-B8-1","Proxy ballot reconciliation agent",["PAS-B8-2"],"Collects meeting notices and ballots, reconciles them to eligible share positions by record date and flags mismatches. Logs all reconciliation steps.",4,"Humans review only position mismatches; audit trail is retained.",""],["UC-PAS-B8-2","Resolution analysis and vote recommendation agent",["PAS-B8-3","PAS-B8-4"],"Reads meeting materials and proxy adviser research, compares resolutions with policy and drafts vote recommendations with rationale. Prepares instructions for the voting platform.",2,"Stewardship analysts approve all non-standard votes and every instruction before lodgement.","https://corpgov.law.harvard.edu/2026/03/05/building-a-policy-first-system-for-proxy-voting-and-governance-analysis/"],["UC-PAS-B8-3","Engagement prioritisation agent",["PAS-B8-5"],"Ranks companies for engagement using holding size, controversy signals and thematic priorities, and drafts briefing notes. Tracks dialogue and outcomes.",1,"Stewardship team decides which companies to engage and conducts all dialogue.",""],["UC-PAS-B8-4","Stewardship reporting and provider oversight agent",["PAS-B8-6","PAS-B8-8"],"Compiles voting records and engagement case studies, and drafts sections of the UK Stewardship Code report. Compares proxy adviser recommendations with policy to support provider reviews.",2,"Head of stewardship approves all published reports and provider conclusions.",""]]},{"i":"PAS-B9","n":"Regulatory, Governance & Reporting","o":"X","p":"Keep products, disclosures and controls compliant, and give boards and clients evidence of oversight and outcomes.","a":[["PAS-B9-1","Run product governance and fund board oversight","Support fund boards and committees with MI covering performance, tracking, fair value and conflicts."],["PAS-B9-2","Apply SDR labels and anti-greenwashing rules","Assess whether sustainability labels and claims meet FCA SDR criteria and evidence them."],["PAS-B9-3","Monitor UCITS and COLL compliance","Test investment limits, liquidity, leverage and derivative use against UCITS and FCA COLL rules."],["PAS-B9-4","Manage liquidity and risk monitoring","Run liquidity stress tests, ETF market stress scenarios and operational risk assessments."],["PAS-B9-5","File transaction and regulatory reports","Submit transaction reporting, SFTR and other regulatory returns including lending and derivative activity."],["PAS-B9-6","Maintain TCFD and ESG disclosure","Prepare entity and product climate-related disclosures and sustainability data for clients and regulators."],["PAS-B9-7","Run conflicts, complaints and breach management","Log conflicts, complaints and breaches, escalate incidents and track remediation."],["PAS-B9-8","Evidence operational resilience and third-party oversight","Map important business services, test impact tolerances and oversee administrator, custodian and index vendors."]],"u":[["UC-PAS-B9-1","Board and committee MI pack agent",["PAS-B9-1"],"Assembles MI on performance, tracking, fair value and conflicts from source systems into board packs. Highlights trends and breaches with drill-down references.",2,"Governance team reviews and approves each pack before circulation.",""],["UC-PAS-B9-2","SDR and climate disclosure claims checker",["PAS-B9-2","PAS-B9-6"],"Tests label and marketing claims against SDR criteria and underlying ESG and climate data, and drafts disclosure sections with evidence links. Flags unsupported statements.",2,"Compliance and sustainability leads approve claims and every published disclosure.",""],["UC-PAS-B9-3","UCITS, COLL and liquidity monitoring agent",["PAS-B9-3","PAS-B9-4"],"Runs periodic limit, liquidity, leverage and derivative tests and scenario stress runs, and compiles exception reports. Tracks remediation status.",3,"Risk and compliance review exceptions and sampled results; breach decisions rest with humans.",""],["UC-PAS-B9-4","Regulatory reporting, conflicts and resilience agent",["PAS-B9-5","PAS-B9-7","PAS-B9-8"],"Prepares transaction and SFTR report data with validation checks, logs conflicts, complaints and breaches, and maps service dependencies and vendor evidence for resilience reviews. Drafts escalations and remediation tracking.",2,"Compliance approves every regulatory submission, breach classification and escalation.",""]]}],"rg":{"d":["UCITS","SFTR","Stewardship Code","SDR"],"c":["SM&CR","Operational resilience","TCFD"]}},{"k":"L","n":"Alternatives","as":["Analyst design from general knowledge; no web research, no statistics or named-firm claims.","Manager is a UK-authorised AIFM (full-scope UK AIFM or small authorised) under FCA FUND/AIFMD-derived rules, marketing to professional investors via NPPR/UK marketing rules; some EU access via national private placement.","Covers a multi-strategy house: private equity, private credit, and real assets (infrastructure, real estate); activities are generic across strategies unless noted.","Closed-ended limited partnership structures (English/Scottish LP, Lux/Cayman feeders) with GP/AIFM, depositary-lite oversight, and a third-party fund administrator.","Some retail-accessible wrappers (LTAF, ELTIF) may exist, so Consumer Duty, product governance and distribution oversight are included where relevant.","Deal activity is subject to NSIA mandatory/voluntary notification, merger control, sanctions and AML screening, and sector-specific regulatory approvals.","Blocks follow the fund lifecycle sequence; Investor Relations spans fundraising through reporting but is placed once at LP onboarding.","Office labels are indicative: Front = investment and fundraising teams, Middle = risk/valuation/compliance oversight, Back = administration and finance operations.","Agentic use cases are intentionally excluded from this step.","No public sources used (no web searches run); every use case is analyst design and no statistics or ROI figures are claimed.","Manager is a UK authorised AIFM running PE, private credit and real assets funds with a third-party administrator and depositary-lite oversight.","Autonomy follows the hard rule: no IC decision, valuation sign-off, capital call or distribution release, or LP-adverse outcome above L3; most are L2.","Only one L4 use case (portfolio reporting ingestion), as low-risk data admin with audit trail.","Agents assist humans in negotiation, relationship, board and partner-led activities rather than replacing them.","Retail-accessible LTAF or ELTIF products exist, so Consumer Duty applies in block 9 and LP classification in block 2."],"x":[],"b":[{"i":"ALT-B1","n":"Fund Strategy, Structuring & Fundraising","o":"F","p":"Define the fund proposition, set its legal and regulatory structure, and raise commitments from institutional investors.","a":[["ALT-B1-1","Define fund strategy and target returns","Set investment thesis, sector focus, geography, target return, risk profile and fund size for the new vehicle."],["ALT-B1-2","Design fund structure and domiciles","Select LP, feeder, parallel and co-invest structures and domiciles, considering tax transparency and investor tax requirements."],["ALT-B1-3","Draft LPA and offering documents","Prepare limited partnership agreement, PPM, side letter templates, fee and carried interest terms, and ILPA-aligned governance provisions."],["ALT-B1-4","Obtain FCA permissions and marketing approvals","Confirm AIFM authorisation scope, approve financial promotions, and complete NPPR or national placement notifications for each target jurisdiction."],["ALT-B1-5","Build investor target list and pipeline","Segment pensions, insurers, sovereign wealth, funds of funds and family offices; prioritise prospects and plan roadshows."],["ALT-B1-6","Prepare data room and DDQ responses","Assemble track record, team, ESG policy, operational and compliance materials and answer investor due diligence questionnaires."],["ALT-B1-7","Negotiate commitments and side letters","Agree LPA terms, most-favoured-nation provisions and bespoke side letter rights with anchor and other investors."],["ALT-B1-8","Run closings and manage fundraising pipeline","Hold first and subsequent closes, equalise late-closing investors and track commitments against target and hard cap."]],"u":[["UC-ALT-B1-1","Fund strategy benchmarking agent",["ALT-B1-1"],"Agent pulls peer fund terms, return data and market commentary from licensed data feeds and internal track record, then assembles a benchmarking pack for target returns and fund size. It cites each data point and flags gaps.",1,"Partners set strategy, target returns and fund size; the agent only suggests.",""],["UC-ALT-B1-2","LPA, structure and side letter drafting agent",["ALT-B1-2","ALT-B1-3","ALT-B1-7"],"Agent compares precedent LPAs and ILPA principles against term sheets to draft clauses and a structure options memo, and tracks MFN election exposure across side letters. It works from the document library, tax structure charts and the side letter register.",2,"Legal counsel and the GP approve every clause, structure choice and side letter before it is shared.",""],["UC-ALT-B1-3","Marketing approvals and NPPR tracker agent",["ALT-B1-4"],"Agent maps target jurisdictions to NPPR or private placement requirements, drafts notification checklists and checks marketing materials against the financial promotion rules. It tracks filing status in the compliance calendar.",2,"Compliance approves every financial promotion and submits every regulatory filing.",""],["UC-ALT-B1-4","Investor targeting, DDQ and closings agent",["ALT-B1-5","ALT-B1-6","ALT-B1-8"],"Agent scores LP prospects from CRM and public data, drafts DDQ answers from the approved response library, and tracks commitments, hard cap and equalisation per close. It reads the CRM, data room and commitment register.",2,"IR head approves outbound targeting lists, DDQ answers and closing equalisation calculations before release.",""]]},{"i":"ALT-B2","n":"Investor Relations & LP Onboarding","o":"D","p":"Admit limited partners compliantly and manage ongoing relationships and enquiries across the fund life.","a":[["ALT-B2-1","Collect LP subscription documents","Obtain signed subscription agreements, investor questionnaires, tax forms and authorised signatory details from each incoming investor."],["ALT-B2-2","Perform LP KYC and AML checks","Verify identity, beneficial ownership and source of funds under UK Money Laundering Regulations, with sanctions and PEP screening."],["ALT-B2-3","Classify investors and test eligibility","Confirm professional or eligible investor status and suitability for marketing, including LTAF or ELTIF restrictions and Consumer Duty considerations."],["ALT-B2-4","Process FATCA, CRS and tax onboarding","Capture tax residency and self-certification data and set up withholding and reporting treatment for each LP."],["ALT-B2-5","Set up investor records and portal access","Create investor register entries, commitment records, bank details and secure data room and portal credentials."],["ALT-B2-6","Manage LP queries and meetings","Respond to investor enquiries, schedule annual meetings and advisory committee sessions, and log interactions in the CRM."],["ALT-B2-7","Maintain LP register and transfers","Process LP transfers, defaults and changes of details, updating the register and reperforming KYC where required."],["ALT-B2-8","Track investor sentiment and re-up prospects","Monitor feedback, ratings and pipeline for successor funds and co-investment appetite across the existing LP base."]],"u":[["UC-ALT-B2-1","LP onboarding and register agent",["ALT-B2-1","ALT-B2-5","ALT-B2-7"],"Agent extracts data from subscription documents, checks completeness, creates register and portal records, and processes transfer and change-of-details requests with a full audit trail. It integrates with the administrator platform and document store.",3,"Operations reviews exceptions and a sample of records; any transfer or default outcome needs human approval.",""],["UC-ALT-B2-2","LP KYC and AML screening agent",["ALT-B2-2"],"Agent verifies identity and beneficial ownership documents, traces ownership chains, runs sanctions and PEP screening and drafts the source of funds assessment. It uses registry, screening and document tools under the MLR.",3,"MLRO or delegate decides every escalated or adverse outcome; no LP is rejected or admitted without human sign-off on exceptions.",""],["UC-ALT-B2-3","Investor classification and tax onboarding agent",["ALT-B2-3","ALT-B2-4"],"Agent classifies investors against professional or eligible investor tests, applies LTAF and ELTIF restrictions, and validates FATCA and CRS self-certifications against KYC data. It produces a reasoned recommendation per LP.",2,"Compliance approves every classification and tax treatment before the LP is admitted.",""],["UC-ALT-B2-4","LP queries and re-up insight agent",["ALT-B2-6","ALT-B2-8"],"Agent drafts responses to LP queries from approved fund documents, schedules meetings and logs CRM interactions, and summarises feedback to flag re-up and co-invest appetite. It works across email, CRM and meeting notes.",2,"IR professional approves every response sent to an LP and every prospect rating change.",""]]},{"i":"ALT-B3","n":"Deal Sourcing & Screening","o":"F","p":"Originate and filter investment opportunities against fund strategy, mandate limits and regulatory constraints.","a":[["ALT-B3-1","Map target sectors and companies","Build market maps of target companies, assets, borrowers or projects aligned to the fund thesis and pipeline priorities."],["ALT-B3-2","Originate proprietary and intermediary deals","Cultivate relationships with sponsors, advisers, banks and management teams to generate and receive deal flow."],["ALT-B3-3","Receive and log inbound opportunities","Capture teasers, information memoranda and approaches, record them in the deal pipeline and acknowledge intermediaries."],["ALT-B3-4","Screen against fund mandate and limits","Test each opportunity against investment policy, concentration limits, leverage and diversification restrictions in the LPA."],["ALT-B3-5","Run preliminary financial and credit screening","Review headline financials, valuation, structure, leverage and returns to decide whether to proceed to detailed work."],["ALT-B3-6","Screen sanctions, reputational and ESG exclusions","Check counterparties, owners and activities against sanctions lists, exclusion policy and sustainability criteria."],["ALT-B3-7","Assess NSIA and regulatory triggers early","Identify potential National Security and Investment Act, merger control and sector regulator approvals that affect timing and feasibility."],["ALT-B3-8","Submit indicative offers and secure exclusivity","Prepare non-binding offers or term sheet indications and negotiate exclusivity and process terms with sellers."]],"u":[["UC-ALT-B3-1","Market mapping and origination agent",["ALT-B3-1","ALT-B3-2"],"Agent builds target company and asset maps from data providers, filings and news, and drafts tailored outreach to sponsors and advisers based on relationship history. It monitors trigger events in the target universe.",2,"Deal team approves the target list and every outbound message.",""],["UC-ALT-B3-2","Inbound deal triage and mandate check agent",["ALT-B3-3","ALT-B3-4"],"Agent reads teasers and information memoranda, logs them in the pipeline and tests each against LPA limits, concentration and leverage rules. It drafts acknowledgements and a pass or proceed recommendation.",3,"Deal lead reviews exceptions and a sample of triage outcomes; mandate breaches are escalated to compliance.",""],["UC-ALT-B3-3","Preliminary screening and indicative offer agent",["ALT-B3-5","ALT-B3-8"],"Agent spreads headline financials, runs quick valuation and credit metrics, and drafts indicative offer and exclusivity terms from precedent. It uses a spreading tool and the firm's templates.",2,"Partner approves any decision to proceed and every indicative offer or exclusivity term sent.",""],["UC-ALT-B3-4","Sanctions, ESG and NSIA early-screening agent",["ALT-B3-6","ALT-B3-7"],"Agent screens owners and counterparties against sanctions lists and exclusion policy, and assesses activities against the NSIA mandatory sectors and merger control thresholds. It outputs a flagged risk note with evidence.",3,"Compliance and legal review all flags and a sample of clears; any NSIA or sanctions conclusion is signed off by a human.",""]]},{"i":"ALT-B4","n":"Due Diligence & Underwriting","o":"F","p":"Investigate the target thoroughly and build the investment case, structure and financing for approval.","a":[["ALT-B4-1","Scope diligence workstreams and advisers","Define commercial, financial, legal, tax, technical, ESG and insurance workstreams and appoint external advisers and budgets."],["ALT-B4-2","Manage virtual data room review","Organise target documents, track requests and responses, and consolidate findings from advisers into issue lists."],["ALT-B4-3","Perform commercial and market diligence","Assess market size, competitive position, customer concentration and growth drivers, or asset demand and contractual revenues."],["ALT-B4-4","Analyse financial, tax and legal findings","Review quality of earnings, debt-like items, tax structuring, contracts, litigation and title or security packages."],["ALT-B4-5","Build financial model and returns scenarios","Construct operating, debt and returns models with base, downside and sensitivity cases for IRR, multiple and cash yield."],["ALT-B4-6","Structure the investment and financing","Design equity, mezzanine or senior terms, covenants, security, ranking and intercreditor arrangements with lenders and co-investors."],["ALT-B4-7","Assess ESG, climate and sustainability risks","Evaluate environmental, social and governance factors, climate risk and SDR or SFDR-style disclosure implications for the investment."],["ALT-B4-8","Prepare investment paper and risk assessmen
