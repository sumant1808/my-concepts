t","Write the investment memorandum with thesis, risks, mitigants, valuation and independent risk function input."]],"u":[["UC-ALT-B4-1","Data room review and issue list agent",["ALT-B4-1","ALT-B4-2","ALT-B4-4"],"Agent indexes the virtual data room, tracks requests and responses, extracts key terms from contracts and adviser reports, and builds a consolidated issue list. It highlights debt-like items, litigation and security gaps.",2,"Deal team and advisers confirm each material finding before it enters the investment case.",""],["UC-ALT-B4-2","Commercial and market diligence agent",["ALT-B4-3"],"Agent gathers market data, competitor information and customer concentration indicators from the data room and external sources, and drafts a commercial diligence summary with sources. It checks contractual revenue patterns for assets.",2,"Deal team validates assumptions and conclusions before use in the model or paper.",""],["UC-ALT-B4-3","Returns model and financing structure agent",["ALT-B4-5","ALT-B4-6"],"Agent builds base, downside and sensitivity cases from the model template, and compares financing structure options on covenants, ranking and intercreditor terms. It runs scenarios in the modelling environment.",2,"Deal team owns the model and signs off every assumption and structure choice.",""],["UC-ALT-B4-4","ESG risk and investment paper drafting agent",["ALT-B4-7","ALT-B4-8"],"Agent assesses ESG and climate risk using disclosures, datasets and diligence reports, notes SDR implications, and drafts sections of the investment paper with a risk register for the risk function. It cross-references figures to the model.",2,"Deal lead approves the paper; the independent risk function signs off the risk assessment.",""]]},{"i":"ALT-B5","n":"Investment Committee, Execution & Closing","o":"F","p":"Obtain formal approval, negotiate and sign transaction documents, and complete the investment in compliance with conditions.","a":[["ALT-B5-1","Present to investment committee","Submit papers, present the case, record challenges and conditions, and document the IC decision and voting."],["ALT-B5-2","Check conflicts and allocation across funds","Confirm conflicts of interest are managed and allocate the opportunity across funds and co-investors per policy."],["ALT-B5-3","Negotiate transaction documents","Agree SPA, shareholder agreement, loan or facility agreement, warranties and indemnities, and security documents with counterparties."],["ALT-B5-4","Obtain regulatory and third-party consents","Secure NSIA clearance, merger control, lender, landlord and change-of-control consents needed before completion."],["ALT-B5-5","Finalise financing and hedging arrangements","Close acquisition debt, fund-level facilities and interest rate or currency hedges, confirming terms with lenders."],["ALT-B5-6","Complete conditions precedent and sign-off","Track CP checklists, legal opinions, insurance and approvals, and confirm readiness to sign and complete."],["ALT-B5-7","Fund the transaction and settle flows","Call capital or draw subscription lines, release funds on completion and confirm payments with administrator and depositary-lite controls."],["ALT-B5-8","Capture closing documents and set up monitoring","Compile completion bundles, record terms and covenants in systems and hand over to the portfolio team."]],"u":[["UC-ALT-B5-1","IC pack and decision record agent",["ALT-B5-1"],"Agent compiles the IC pack from the investment paper, model and diligence outputs, prepares challenge questions from past IC minutes, and drafts the minutes and conditions log. It does not recommend a vote.",2,"Investment Committee members make and record the decision; the agent never votes or approves.",""],["UC-ALT-B5-2","Conflicts and cross-fund allocation agent",["ALT-B5-2"],"Agent checks the opportunity against conflicts registers, co-invest rules and the allocation policy, and drafts an allocation proposal with rationale. It reads the fund mandates and portfolio holdings.",2,"Compliance and the allocation committee approve all conflict clearances and allocation outcomes.",""],["UC-ALT-B5-3","Transaction documents, consents and financing tracker agent",["ALT-B5-3","ALT-B5-4","ALT-B5-5"],"Agent redlines SPA and facility drafts against precedent and agreed terms, tracks consents including NSIA, merger control and lender approvals, and monitors financing and hedge term alignment. It works in the document management system.",2,"Lawyers and the deal team approve every document position, consent submission and financing term.",""],["UC-ALT-B5-4","CP, funds flow and closing bundle agent",["ALT-B5-6","ALT-B5-7","ALT-B5-8"],"Agent tracks the CP checklist, verifies the funds flow memo against signed documents and administrator figures, and compiles the closing bundle and covenant records for monitoring. It reconciles amounts across sources.",2,"Authorised signatories and the administrator release funds; a human approves the CP sign-off and every payment.",""]]},{"i":"ALT-B6","n":"Portfolio Monitoring & Value Creation","o":"F","p":"Oversee investments after closing, drive operational and financial improvement, and manage risk and covenant compliance.","a":[["ALT-B6-1","Agree 100-day and value creation plans","Define operational, commercial and financial initiatives with management, including targets, owners and milestones."],["ALT-B6-2","Collect portfolio company reporting","Gather monthly and quarterly management accounts, KPIs, covenant certificates and operating data from investee companies and borrowers."],["ALT-B6-3","Monitor covenants and credit performance","Test financial covenants, track headroom, rate credit quality and escalate watchlist cases, waivers and amendments."],["ALT-B6-4","Support board governance and management","Attend boards, appoint directors, agree budgets, incentive plans and key hires, and oversee senior management performance."],["ALT-B6-5","Run buy-and-build and follow-on investments","Evaluate add-on acquisitions, capex and follow-on funding needs and take them through approval and execution."],["ALT-B6-6","Track ESG and sustainability performance","Collect emissions, safety and governance data from assets and report progress against agreed ESG improvement plans."],["ALT-B6-7","Manage asset-level risks and operations","Oversee construction, regulatory, insurance, tenant and counterparty risks for infrastructure and real estate assets."],["ALT-B6-8","Manage portfolio and fund-level risk","Monitor concentration, leverage, liquidity, stress tests and exposure limits at fund level, reporting to risk function and committees."]],"u":[["UC-ALT-B6-1","Portfolio reporting ingestion agent",["ALT-B6-2"],"Agent collects management accounts, KPIs and covenant certificates from portfolio companies and borrowers, extracts and normalises the figures and loads them into the monitoring database. It chases late submissions and logs every change.",4,"Portfolio team reviews monthly exception reports and data quality sample checks.",""],["UC-ALT-B6-2","Covenant and credit monitoring agent",["ALT-B6-3"],"Agent tests covenants against ingested financials, calculates headroom, proposes internal credit ratings and drafts watchlist and waiver notes. It alerts the deal team to forecast breaches.",3,"Credit or portfolio head reviews exceptions and approves every watchlist move, waiver or amendment.",""],["UC-ALT-B6-3","Value creation and board support agent",["ALT-B6-1","ALT-B6-4","ALT-B6-5"],"Agent tracks 100-day plan milestones against KPIs, prepares board papers and budget variance commentary, and screens add-on acquisition and follow-on funding proposals. It reads portfolio data and board packs.",2,"Deal partner approves plans, hires and incentive decisions; follow-on investments go through full IC approval.",""],["UC-ALT-B6-4","ESG, asset and fund risk monitoring agent",["ALT-B6-6","ALT-B6-7","ALT-B6-8"],"Agent collects ESG and operating data from assets, tracks insurance, construction and tenant risks, and runs concentration, leverage and liquidity stress tests at fund level. It reports breaches to the risk function.",3,"Risk function reviews exceptions and approves any limit breach treatment or escalation to committees.",""]]},{"i":"ALT-B7","n":"Valuation, Fund Admin, Capital Calls & Distributions","o":"B","p":"Value illiquid holdings, run fund accounting, and administer cash movements between the fund and its investors.","a":[["ALT-B7-1","Prepare periodic asset valuations","Apply IPEV-aligned methods such as comparables, DCF and calibrated pricing to fair value each investment."],["ALT-B7-2","Run valuation committee review","Challenge valuations, document judgements and assumptions, and obtain independent review consistent with AIFMD valuation function requirements."],["ALT-B7-3","Maintain fund accounting and NAV","Record investments, expenses and fees, calculate NAV per investor and prepare financial statements under applicable GAAP."],["ALT-B7-4","Calculate management fees and carried interest","Apply LPA fee basis, offsets, hurdles, catch-up and clawback to compute fees and carried interest waterfall allocations."],["ALT-B7-5","Issue capital call notices","Determine funding needs, compute pro rata amounts per LP, issue notices and manage notice periods and drawdown timing."],["ALT-B7-6","Reconcile cash and manage investor receipts","Match investor payments to calls, chase late payers, apply default provisions and manage subscription line borrowings."],["ALT-B7-7","Calculate and pay distributions","Apply the distribution waterfall to proceeds, handle recallable amounts and withholding tax, and release payments to investors."],["ALT-B7-8","Oversee administrator and depositary-lite controls","Review administrator outputs, cash monitoring and asset verification, reconcile records, and manage service provider performance."]],"u":[["UC-ALT-B7-1","Valuation preparation agent",["ALT-B7-1"],"Agent gathers comparables, builds DCF and calibrated pricing workings aligned to IPEV guidelines, and drafts a valuation rationale per investment. It uses market data and the portfolio reporting database.",2,"Valuation team reviews and signs off every valuation before it goes to committee.",""],["UC-ALT-B7-2","Valuation committee challenge pack agent",["ALT-B7-2"],"Agent compiles the committee pack, compares movements against comparables and prior periods, and drafts challenge questions and the judgement log. It flags outliers and inconsistent assumptions.",2,"Valuation committee and independent reviewer approve all valuations; the agent cannot sign off.",""],["UC-ALT-B7-3","Administrator output reconciliation agent",["ALT-B7-3","ALT-B7-4","ALT-B7-8"],"Agent recomputes NAV, fees and carry waterfall from LPA terms, reconciles them to the administrator's outputs and flags breaks, cash and asset verification differences. It scores service provider KPIs.",3,"Finance reviews exceptions and a sample; the CFO approves NAV, fee and carry figures.",""],["UC-ALT-B7-4","Capital call, receipts and distribution prep agent",["ALT-B7-5","ALT-B7-6","ALT-B7-7"],"Agent drafts call and distribution notices with pro rata amounts and withholding, matches investor receipts to calls and prepares default notices. It works from the register, administrator data and bank feeds.",2,"Authorised signatories approve every notice, default action and payment release.",""]]},{"i":"ALT-B8","n":"Exit & Realisation","o":"F","p":"Plan and execute exits and refinancings, and convert investments into returns for investors and the carry waterfall.","a":[["ALT-B8-1","Develop exit strategy and timing","Assess exit routes such as trade sale, IPO, secondary or refinancing, balancing market conditions, hold periods and fund term."],["ALT-B8-2","Prepare asset for sale","Commission vendor due diligence, clean up accounts and legal issues, and build the equity story and information memorandum."],["ALT-B8-3","Run sale process and select buyer","Manage adviser appointment, buyer outreach, bids and negotiations, and compare offers on price, certainty and terms."],["ALT-B8-4","Negotiate sale and refinancing documents","Agree SPA, warranty and indemnity cover, management arrangements, or refinancing and loan repayment terms with counterparties."],["ALT-B8-5","Obtain approvals and manage conditions","Secure IC and LPAC approvals where needed, regulatory clearances including NSIA, and satisfy completion conditions."],["ALT-B8-6","Complete exit and allocate proceeds","Receive proceeds, settle debt and costs, and hand final figures to administrator for waterfall and distribution."],["ALT-B8-7","Handle escrow, warranty claims and earn-outs","Track retained amounts, deferred consideration and warranty claims, and release or recover funds after completion."],["ALT-B8-8","Assess realised performance and lessons learned","Compare outcomes to underwriting, record realised returns and capture lessons for future investment decisions."]],"u":[["UC-ALT-B8-1","Exit timing and lessons learned agent",["ALT-B8-1","ALT-B8-8"],"Agent models exit routes and timing against market data, hold period and fund term, and compares realised outcomes to underwriting to draft lessons learned. It reads historic IC papers and portfolio data.",1,"Deal team and partners set exit strategy and approve the lessons log.",""],["UC-ALT-B8-2","Sale preparation and buyer process agent",["ALT-B8-2","ALT-B8-3"],"Agent drafts the equity story, vendor due diligence request lists and buyer outreach lists, and compares bids on price, certainty and terms. It tracks process timelines in the data room.",2,"Deal team approves all sale materials and the choice of buyer.",""],["UC-ALT-B8-3","Sale documents and conditions agent",["ALT-B8-4","ALT-B8-5"],"Agent redlines SPA, W&I and refinancing documents against precedent, and tracks IC, LPAC, NSIA and other conditions. It monitors satisfaction of conditions to completion.",2,"Lawyers and the deal team approve all positions; IC and LPAC approvals are obtained const UC_REC = allU().filter((e) => e.u[0] === 'UC-ACT-B5-2')[0].u;
function rowState(r, d) { let cur = null; r[4].forEach((x) => { if (x[0] <= d) cur = x; }); return cur; }
function demoBegin() {
  if (timer) clearInterval(timer);
  S.demo = 1; S.play = true; S.dec = ''; renderDem(false, true);
  timer = setInterval(() => {
    if (!S.play) return;
    if (S.demo >= NS) { S.play = false; renderDem(); return; }
    S.demo++; renderDem();
  }, 2600);
}
function demoClose() { if (timer) { clearInterval(timer); timer = null; } S.demo = 0; S.play = false; S.dec = ''; renderDem(); renderDet(true); }
function chipSt(label, col) { return '<span style="justify-self:start;padding:2px 9px;border-radius:6px;background:' + col + ';color:' + (col === GREY ? '#FFFFFF' : '#0B1626') + ';font-size:12px;font-weight:700;white-space:nowrap">' + label + '</span>'; }
function auditCard() {
  const d = DEC[S.dec];
  const matched = ROWS.filter((r) => rowState(r, 2)[1] === 'MATCH').length;
  const log = STEPS.map((s, k) => '<div style="font-size:13px;line-height:1.45;color:' + muted + '"><b style="color:#EAF0F7">Step ' + (k + 1) + ' · L' + s.lv + ' · ' + s.agent + ':</b> ' + esc(s.log) + '</div>').join('');
  const kv = (k, v) => '<div style="display:grid;grid-template-columns:170px 1fr;gap:10px;font-size:14px;line-height:1.4"><span style="color:#A9B8CC">' + k + '</span><span>' + v + '</span></div>';
  return '<div id="audit" style="flex:1;min-height:0;overflow-y:auto;border-radius:14px;background:#12253B;border:1px solid #5EE0CF;padding:16px 20px;display:flex;flex-direction:column;gap:8px">' +
    '<div class="lab" style="color:#5EE0CF">Audit trail summary · simulated</div>' +
    kv('Reconciliation', 'REC-DEMO-0001') + kv('Fund', 'Example Harbour UK Equity Income Fund (fictional)') + kv('Custodian', 'Custodian X (fictional)') + kv('Run date', 'T-1 (simulated)') +
    kv('Lines', ROWS.length + ' in scope, ' + matched + ' matched, ' + (ROWS.length - matched) + ' breaks') +
    '<div class="lab" style="font-size:12px;color:#F4B942;margin-top:4px">Agent actions</div>' + log +
    '<div class="lab" style="font-size:12px;color:#F4B942;margin-top:4px">Human action</div>' +
    kv('Role', 'Operations analyst (fictional)') + kv('Decision', '<b>' + d[1] + '</b>') + kv('Timestamp', 'simulated, no real time recorded') +
    kv('Human rule (from the design)', '&ldquo;' + esc(UC_REC[5]) + '&rdquo;') +
    '<div style="margin-top:6px;padding:10px 14px;border-radius:10px;border:1px solid #F4B942;background:#241E12;color:#F8D88B;font-size:14px;line-height:1.4">This was a simulation. No real system, custodian, fund or data was used, and the agent posted nothing.</div>' +
    '<div style="display:flex;gap:10px;margin-top:4px;flex-wrap:wrap"><button class="btn" data-act="decClear">Change the decision</button><button class="btn" data-act="demoRestart">Restart the demo</button></div></div>';
}
function renderDem(keepScroll, focusClose) {
  const el = Q('dem'), d = S.demo;
  if (d < 1) { el.style.display = 'none'; el.innerHTML = ''; syncInert(); return; }
  const fk = saveFocus(el);
  const steps = STEPS.map((s, k) => {
    const n = k + 1, a = n === d;
    return '<div class="' + (a ? 'pulse' : '') + '" style="flex:none;padding:9px 14px;border-radius:12px;background:' + (a ? '#1D4E5A' : '#12253B') + ';border:1px solid ' + (a ? '#5EE0CF' : '#223B57') + ';opacity:' + (n > d ? 0.6 : 1) + '"><div style="display:flex;align-items:center;gap:10px"><span style="flex:none;width:26px;height:26px;border-radius:50%;background:' + (a ? '#5EE0CF' : (n < d ? '#9FB3CC' : '#52627A')) + ';color:' + (n > d ? '#FFFFFF' : '#0B1626') + ';font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center">' + n + '</span><span style="flex:1;min-width:0;font-size:15px;font-weight:700">' + s.title + '</span>' + lvBadge(s.lv, true) + '</div>' +
      (a ? '<div style="margin-top:8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#5EE0CF;font-weight:700">' + s.agent + '</div><div style="margin-top:4px;font-size:14px;line-height:1.45">' + s.did + '</div>' : '') + '</div>';
  }).join('');
  const rows = ROWS.filter((r) => r[0] <= d).map((r) => {
    const st = rowState(r, d), fresh = st[0] === d;
    return '<div class="' + (fresh ? 'pop' : '') + '" style="display:grid;grid-template-columns:minmax(0,1fr) 150px 150px 120px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid #1E3550"><span style="font-size:14.5px;font-weight:500">' + r[1] + '</span><span style="font-size:14px">' + r[2] + '</span><span style="font-size:14px">' + r[3] + '</span>' + chipSt(st[1], st[2]) +
      (st[3] ? '<span style="grid-column:1/-1;font-size:12.5px;color:' + muted + '">' + st[3] + '</span>' : '') + '</div>';
  }).join('');
  const table = '<div style="flex:1;min-height:0;overflow-y:auto;border-radius:14px;background:#12253B;border:1px solid #223B57;padding:12px 18px"><div class="lab" style="font-size:12px;color:#F4B942;margin-bottom:6px">Break list REC-DEMO-0001 builds as the agents work</div><div style="display:grid;grid-template-columns:minmax(0,1fr) 150px 150px 120px;gap:10px;font-size:12px;color:#A9B8CC;padding-bottom:4px"><span>Line</span><span>Book (IBOR)</span><span>Custodian X</span><span>Status</span></div>' + rows + '</div>';
  const log = STEPS.slice(0, d).map((s, k) => '<div class="' + (k === d - 1 ? 'slide' : '') + '" style="font-size:13px;line-height:1.5;color:' + muted + '"><b style="color:#EAF0F7">Step ' + (k + 1) + ' · L' + s.lv + ' ·</b> ' + s.log + '</div>').join('');
  const logBox = '<div id="dlog" style="height:120px;flex:none;overflow-y:auto;border-radius:14px;background:#0F1F33;border:1px solid #223B57;padding:10px 16px"><div class="lab" style="font-size:12px;color:#5EE0CF;margin-bottom:6px">Agent log</div>' + log + '</div>';
  const ready = d >= NS && !S.play && !S.dec;
  const panel = '<div id="decide" class="rise" style="flex:none;padding:12px 16px;border-radius:14px;border:1px solid #F4B942;background:#241E12;display:flex;flex-direction:column;gap:10px"><div style="font-size:16px;line-height:1.4;color:#F8D88B"><b>An operations analyst decides.</b> The agent prepared the evidence; it posted nothing.</div><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">' +
    Object.keys(DEC).map((k) => '<button class="btn" data-act="dec" data-v="' + k + '" style="min-height:56px;padding:8px 14px;border-radius:12px;font-size:14px;line-height:1.3;background:#12253B;border-color:#F4B942;text-align:left">' + DEC[k][0] + '</button>').join('') + '</div></div>';
  const right = S.dec ? auditCard() : (table + (ready ? panel : logBox));
  const label = d >= NS && !S.play ? 'Replay' : (S.play ? 'Pause' : 'Play');
  const fromDet = S.seg >= 0;
  const old = el.querySelector('#audit');
  el.style.display = 'flex'; el.style.flexDirection = 'column'; el.style.padding = '22px 40px 24px'; el.style.boxSizing = 'border-box'; el.style.gap = '12px';
  el.innerHTML = '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:20px"><div><div class="lab" style="color:#5EE0CF">Agent demo · Active · Middle office · simulated, fictional data</div><h2 style="margin:6px 0 0;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:28px;line-height:1.12;max-width:760px">' + (d >= NS ? 'The break list reaches operations with the evidence attached and nothing posted' : STEPS[d - 1].title) + '</h2></div>' +
    '<div style="display:flex;gap:10px;flex:none;flex-wrap:wrap;justify-content:flex-end;max-width:470px"><button class="btn" data-act="demoClose">' + (fromDet ? 'Back to blocks' : 'Close demo') + '</button><button class="btn p" data-act="demoToggle">' + label + '</button><button class="btn" data-act="demoNext">Next step</button><button class="btn" data-act="demoRestart">Restart</button></div></div>' +
    '<div style="flex:none;height:6px;border-radius:3px;background:#12253B"><div style="height:6px;border-radius:3px;background:#5EE0CF;width:' + Math.round(d / NS * 100) + '%;transition:width .8s ease"></div></div>' +
    '<div style="flex:1;min-height:0;display:flex;gap:18px"><div style="width:380px;flex:none;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px">' + steps + '</div>' +
    '<div style="flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px">' + right + '</div></div>' +
    '<div style="position:absolute;right:40px;bottom:5px;padding:1px 8px;border-radius:4px;background:#F4B942;color:#0B1626;font-size:11px;font-weight:700;letter-spacing:.14em">SIMULATION</div>';
  const nl = el.querySelector('#dlog');
  if (nl) nl.scrollTop = nl.scrollHeight;
  syncInert();
  if (focusClose) { const c = el.querySelector('[data-act="demoClose"]'); if (c) c.focus(); }
  else if (S.dec && !old) { const a = el.querySelector('#audit'); if (a) { a.setAttribute('tabindex', '-1'); a.focus({ preventScroll: true }); } }
  else restoreFocus(el, fk);
}

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === 'go') goto(+v);
  else if (a === 'prev') goto(S.i - 1);
  else if (a === 'next') goto(S.i === N - 1 ? 0 : S.i + 1);
  else if (a === 'openDet') { S.seg = +v; S.blk = 0; S.open = -1; S.asm = false; renderDet(false, true); }
  else if (a === 'closeDet') { S.seg = -1; renderDet(); syncInert(); const t = Q('slide').querySelector('[data-act="openDet"]'); if (t) t.focus(); }
  else if (a === 'seg') { S.seg = +v; S.blk = 0; S.open = -1; S.asm = false; renderDet(); }
  else if (a === 'blk') { S.blk = +v; S.open = -1; renderDet(); }
  else if (a === 'uc') { S.open = S.open === +v ? -1 : +v; renderDet(true); }
  else if (a === 'asm') { S.asm = !S.asm; renderDet(true); }
  else if (a === 'demoOpen') demoBegin();
  else if (a === 'demoClose') { demoClose(); const t = S.seg < 0 ? Q('slide').querySelector('[data-act="demoOpen"]') : null; if (t) t.focus(); }
  else if (a === 'demoToggle') { if (S.demo >= NS && !S.play) demoBegin(); else if (!timer) demoBegin(); else { S.play = !S.play; renderDem(); } }
  else if (a === 'demoNext') { S.demo = Math.min(NS, S.demo + 1); S.play = false; renderDem(); }
  else if (a === 'demoRestart') demoBegin();
  else if (a === 'dec') { S.dec = v; renderDem(); }
  else if (a === 'decClear') { S.dec = ''; renderDem(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (S.demo > 0) { demoClose(); return; }
    if (S.seg >= 0) { S.seg = -1; renderDet(); }
    return;
  }
  if (S.seg >= 0 || S.demo > 0) return;
  if (e.target && e.target.closest && e.target.closest('input,textarea,select')) return;
  if (e.key === 'ArrowRight') goto(S.i + 1);
  if (e.key === 'ArrowLeft') goto(S.i - 1);
});
function fit() {
  const s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  const st = Q('stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.left = Math.max(0, (window.innerWidth - 1280 * s) / 2) + 'px';
  st.style.top = Math.max(0, (window.innerHeight - 720 * s) / 2) + 'px';
}
window.addEventListener('resize', fit);
fit(); renderSlide(); renderNav();
</script>
</body>
